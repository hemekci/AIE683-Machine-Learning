# Supervised Learning

.larger[
$$ (x_i, y_i) \sim p(x, y) \text{ i.i.d.}$$
$$ x_i \in \mathbb{R}^p$$
$$ y_i \in \mathbb{R}$$
$$\text{learn }f(x_i) \approx y_i$$
such that
$$f(x) \approx y \quad$$
for new $(x, y) \sim p(x, y)$.
]
???
In supervised learning, we learn from input-output pairs $(x_i, y_i)$, where
$x_i$ is a p-dimensional feature vector and $y_i$ is the output we want to predict.
We assume the samples are drawn i.i.d. from an unknown joint distribution $p(x, y)$.
Fitting the training data is easy; the real requirement is the last line: for new
$x$ drawn from the same distribution, $f(x)$ should be close to $y$.
Keep the i.i.d. assumption in mind; in the second half we will see what to do
when it does not hold.

The simplest approach is to split the data into a training set and a test set,
for example 75% and 25%. We fit the model on the training part and measure accuracy on the rest.
If the i.i.d. assumption holds, the test accuracy is an unbiased estimate of accuracy on future data.
The important word is "if": the test set has to look like the data the model will see later.

# KNN with scikit-learn

```python
from sklearn.model_selection import train_test_split
X_train, X_test, y_train, y_test = train_test_split(X, y)

from sklearn.neighbors import KNeighborsClassifier
knn = KNeighborsClassifier(n_neighbors=1)
knn.fit(X_train, y_train)
print(f"accuracy: {knn.score(X_test, y_test):.2f}")
y_pred = knn.predict(X_test)
```
```
accuracy: 0.77
```

???
`train_test_split` does a random 75/25 split by default.
Every scikit-learn model is a class: hyper-parameters such as `n_neighbors` are set in
the constructor, and `fit` estimates everything that is learned from data.
For nearest neighbors, `fit` simply stores the training set.
`score` calls `predict` internally and, for classifiers, returns accuracy.
This fit / predict / score interface is the same for every model in the course.

# Bias and Variance

For squared loss, with $y = f(x) + \varepsilon$ and $\text{Var}(\varepsilon) = \sigma^2$,
the expected error of a model $\hat{f}$ trained on a random training set is

$$
\mathbb{E}\big[(y - \hat{f}(x))^2\big] =
\underbrace{\big(f(x) - \mathbb{E}[\hat{f}(x)]\big)^2}\_{\text{bias}^2}
+ \underbrace{\text{Var}\big[\hat{f}(x)\big]}\_{\text{variance}}
+ \underbrace{\sigma^2}\_{\text{noise}}
$$

.smaller[
- **Bias**: error of the average model; high for too-simple models (underfitting)
- **Variance**: how much the model changes with the training sample; high for too-complex models (overfitting)
- **Noise**: irreducible, no model can remove it
- kNN: small $k$ gives low bias and high variance; large $k$ gives high bias and low variance
]

???
The same picture has a precise version for squared loss. The expectation is over training sets
as well as over the noise: imagine drawing many training sets and refitting the model each time.
Bias measures how far the average fitted model is from the truth; variance measures how much
the fits disagree with each other. The noise term is a floor that no model can go below.
For one-nearest-neighbor, each prediction depends on a single training point, so it changes a lot
between training sets: high variance. A common misconception is that you can drive both terms to zero
with enough tuning; in practice you trade one against the other, and more data is what reduces variance.

How would you implement k nearest neighbors? The brute-force version needs no fitting,
stores the whole dataset, and compares a new point against every training point at prediction time.
So memory and prediction time both grow with the size of the training set, which is the opposite

# So far: Train-test-split

![:scale 100%](images/train_test_split_new.png)

???
So far we split the data once, trained on the training set and evaluated on the test set.
Now suppose we want to choose `n_neighbors`. The obvious approach is to try several values
and keep the one with the best test score. What is wrong with that?
The choice of k may be fine, but the reported test score is now optimistic, because we
used the test set to make a decision. It is no longer an independent estimate.

# Threefold split
![:scale 100%](images/train_test_validation_split.png)
???
The simplest fix is a three-way split: a training set to fit models, a validation set to choose
hyper-parameters, and a test set for one final evaluation.
How many models should you evaluate on the test set? One. Every additional look at the test set
turns it into another validation set.
The downsides: less data for training, and the result depends on one particular random split.
--
<br />
<br />
.smallest[Related read: [A. Ng, Preventing "Overfitting" of Cross-Validation Data, ICML 1997](http://robotics.stanford.edu/~ang/papers/cv-final.pdf)]

# Threefold Split for Hyper-Parameters

.smaller[
```python
X_trainval, X_test, y_trainval, y_test = train_test_split(X, y)
X_train, X_val, y_train, y_val = train_test_split(X_trainval, y_trainval)

val_scores = []
neighbors = np.arange(1, 15, 2)
for i in neighbors:
    knn = KNeighborsClassifier(n_neighbors=i)
    knn.fit(X_train, y_train)
    val_scores.append(knn.score(X_val, y_val))
print(f"best validation score: {np.max(val_scores):.3f}")
best_n_neighbors = neighbors[np.argmax(val_scores)]
print("best n_neighbors:", best_n_neighbors)

knn = KNeighborsClassifier(n_neighbors=best_n_neighbors)
knn.fit(X_trainval, y_trainval)
print(f"test-set score: {knn.score(X_test, y_test):.3f}")
```

```
best validation score: 0.925
best n_neighbors: 5
test-set score: 0.937
```
]
???
Here is the three-way split in code, on the breast cancer dataset.
For each candidate k, we fit on the training set and score on the validation set.
The best validation score is 92.5% with five neighbors. We then refit on training plus validation
and evaluate once on the test set.
Refitting is optional, but it uses more data for the final model.
The weakness is that everything depends on one random split: rerun with another seed and k may change.

# Cross-validation
.center[
![:scale 80%](images/cross_validation_new.png)
]
???
Cross-validation addresses that. We split the data into k folds, usually 5 or 10.
Each fold serves once as the test fold while the model is trained on the others,
so we get k scores that we aggregate, usually by the mean, and we can also look at their spread.
Every data point is used for evaluation exactly once.
--
.smaller[
pro: more stable, more data

con: slower
]
???
The cost is computation: k fits instead of one.
Note that cross-validation replaces only one of the splits, usually the inner train/validation split.
We still keep a separate test set.

This is the standard workflow. First split off the test set and put it away.

# Grid-Search with Cross-Validation

.smaller[
```python
from sklearn.model_selection import cross_val_score

X_train, X_test, y_train, y_test = train_test_split(X, y)

cross_val_scores = []
for i in neighbors:
    knn = KNeighborsClassifier(n_neighbors=i)
    scores = cross_val_score(knn, X_train, y_train, cv=10)
    cross_val_scores.append(np.mean(scores))

print(f"best cross-validation score: {np.max(cross_val_scores):.3f}")
best_n_neighbors = neighbors[np.argmax(cross_val_scores)]
print(f"best n_neighbors: {best_n_neighbors}")

knn = KNeighborsClassifier(n_neighbors=best_n_neighbors)
knn.fit(X_train, y_train)
print(f"test-set score: {knn.score(X_test, y_test):.3f}")
```

```
best cross-validation score: 0.927
best n_neighbors: 7
test-set score: 0.944
```
]

???
Here it is by hand. For each k, `cross_val_score` runs 10-fold cross-validation on the training set.
We choose the k with the best mean score, refit on the full training set, and evaluate on the test set.
A question for you: we have seven values of k and 10 folds. How many models do we train in total?
Seventy for the search plus one final model, so 71.

class: center, middle
![:scale 80%](images/gridsearch_workflow.png)

???
Here is the same workflow as a diagram. We start from the dataset and a parameter grid,
split off a test set, use cross-validation on the training part to find the best parameters,
refit with those parameters, and evaluate on the test set.
This pattern is so common that scikit-learn packages it in one class, `GridSearchCV`.

# GridSearchCV
.smaller[
```python
from sklearn.model_selection import GridSearchCV

X_train, X_test, y_train, y_test = train_test_split(X, y, stratify=y)

param_grid = {'n_neighbors': list(range(1, 30, 2))}
grid = GridSearchCV(KNeighborsClassifier(), param_grid=param_grid, cv=10,
                    return_train_score=True)
grid.fit(X_train, y_train)
print(f"best mean cross-validation score: {grid.best_score_:.3f}")
print(f"best parameters: {grid.best_params_}")
print(f"test-set score: {grid.score(X_test, y_test):.3f}")
```

```
best mean cross-validation score: 0.944
best parameters: {'n_neighbors': 5}
test-set score: 0.916
```
]
???
We still split off the test set ourselves. The parameter grid is a dictionary from parameter names
to the values to try; with several parameters, all combinations are tried, hence "grid".
`GridSearchCV` is a meta-estimator: it wraps an estimator and itself has fit, predict and score.
`fit` runs the cross-validation, picks the best setting, and refits on the whole training set.
Notice that the test score here is lower than the best cross-validation score; that is the
optimism from the previous slides, plus the noise of a single test set of 143 samples.

.smaller[
```python
import mlflow
mlflow.set_experiment("week02-generalization-validation")

cv = StratifiedKFold(n_splits=10, shuffle=True, random_state=0)

    mlflow.log_params({"dataset": "breast_cancer", "cv": "StratifiedKFold(10, shuffle)"})

# Nested Cross-Validation

- Replace outer split by CV loop
- Doesn't yield single model
(inner loop might have different best parameter settings)
- Expensive; used to estimate the performance of the whole tuning procedure

```python
grid = GridSearchCV(KNeighborsClassifier(), param_grid, cv=5)
scores = cross_val_score(grid, X, y, cv=5)   # outer loop
```

???
We can also replace the outer train/test split with cross-validation. That is nested cross-validation:
the inner loop selects parameters, the outer loop evaluates the whole selection procedure.
In scikit-learn this is just passing a `GridSearchCV` object to `cross_val_score`.
It does not give you one final model, since each outer fold may choose different parameters,
and it multiplies the cost by the number of outer folds.
It is most useful when comparing modeling approaches; we treat it properly in Week 8.

With plain `KFold` on sorted data, some test folds contain only one class, and the rare class
may be missing from a training set entirely.
`StratifiedKFold` makes each fold's class proportions match the whole dataset.
This matters most with imbalanced classes, where a rare class could otherwise be absent from some folds.
It also reduces the variance of the estimate, as the next slide shows.

# Repeated KFold and LeaveOneOut

- LeaveOneOut : `KFold(n_splits=n_samples)` <br />
High variance, takes a long time <br />
.tiny[(see [Raschka](https://arxiv.org/pdf/1811.12808.pdf) for a review and [Varoquaux](https://hal.inria.fr/hal-01545002/file/paper.pdf) for empirical evaluation)]

- Better: ShuffleSplit (aka Monte Carlo) <br />
Repeatedly draw a random train/test split

- Even Better: RepeatedKFold. <br />
Apply KFold or StratifiedKFold multiple times with shuffled data.

???
The extreme of k-fold is leave-one-out: one sample per test fold. It is expensive, and because the
training sets overlap almost completely, the estimate has high variance.
ShuffleSplit draws independent random splits; test sets of different iterations can overlap.
Repeated k-fold runs k-fold several times with different shuffles and averages over everything.
The two references are good reading if you want the evidence behind these recommendations.

---
class: compact
.center[
![:scale 100%](images/shuffle_split_cv.png)
]
.smaller[Number of iterations and test set size independent]
???
In ShuffleSplit you choose the number of iterations and the train and test sizes independently.
That lets you run many iterations with reasonably large test sets.
It is also handy on very large datasets: set `train_size` small to get fast, subsampled estimates.
There is a `StratifiedShuffleSplit` variant for classification.

---
class: compact
.center[
![:scale 100%](images/repeated_stratified_kfold.png)
]
.smaller[
Potentially less variance than StratifiedShuffleSplit.<br />
Five times five fold or at most ten times ten fold is sufficient.
]
???
`RepeatedStratifiedKFold` runs stratified k-fold several times with different shuffles;
the boxes show the three repetitions. Within each repetition, every sample is tested exactly once.
In practice 5x5 or at most 10x10 is plenty. Keep in mind that repeating does not create new data:
the scores are correlated, so do not treat 50 scores as 50 independent measurements.

# Defaults in scikit-learn

- `cv=5` by default (5-fold)
- For classifiers, integer `cv` means **stratified** k-fold
- `train_test_split` has a stratify option:
`train_test_split(X, y, stratify=y)`
- **No shuffle** by default in KFold / StratifiedKFold
- Set `random_state` whenever you shuffle

???
If you pass nothing or an integer to `cv`, scikit-learn uses 5-fold, and for classifiers it is stratified.
`train_test_split` is not stratified by default; passing `stratify=y` is almost always a good idea for classification.
The k-fold splitters do not shuffle by default, so running cross-validation twice gives identical results;
if your data is sorted, pass a splitter with `shuffle=True`.
And set `random_state` so that your results are reproducible and your MLflow runs are comparable.

# Cross-Validation with non-i.i.d. data

???
Everything so far assumed i.i.d. samples. Real data often violates this:
several measurements from the same patient, many transactions from the same customer,
observations that are close in time or space. In those cases a random split leaks information,
and the estimate is too optimistic.

# Grouped Data
### Assume we have data (medical, product, user...) from 5 cities
- Istanbul, Ankara, Izmir, Bursa, Antalya.

We can assume data within a city is more correlated than between cities.

### Usage Scenarios
- Assume all future users will be in one of these cities: i.i.d.
- Assume we want to generalize to predict for a new city: not i.i.d.

???
Whether you need group-aware splitting depends on the deployment question, not just on the data.
If the product will only ever be used in these five cities, a random split is fine.
If you want to launch in a sixth city, the test set must contain cities the model has never seen.
The same holds for multiple measurements per patient, or several images of the same object.
Ask yourself: what is the unit I want to generalize to?

---
class: fit
![:scale 100%](images/group_kfold.png)

???
`GroupKFold` takes a `groups` array, for example a patient ID, and guarantees that all samples of a group
are either in the training set or in the test set, never split across both.
The leftmost column shows the groups: each test fold consists of whole groups.
Other group-aware splitters are `LeaveOneGroupOut`, `GroupShuffleSplit`, and `StratifiedGroupKFold`,
which also balances classes.

---
# GroupKFold in Code

.smaller[
```python
# 20 patients x 30 measurements; label = the patient's diagnosis
from sklearn.model_selection import GroupKFold, KFold, cross_val_score

knn = KNeighborsClassifier(n_neighbors=5)
kf = cross_val_score(knn, X, y, cv=KFold(5, shuffle=True, random_state=0))
gkf = cross_val_score(knn, X, y, groups=patient_id, cv=GroupKFold(5))
print(f"KFold      accuracy: {kf.mean():.2f}")
print(f"GroupKFold accuracy: {gkf.mean():.2f}")
```
```
KFold      accuracy: 0.99
GroupKFold accuracy: 0.45
```
]

???
This is the simulated patient example from the lab. With a random split, the test set contains
measurements of patients whose other measurements are in the training set, and kNN simply recognizes the patient: 99%.
With GroupKFold, we ask the real question, whether we can diagnose a new patient, and the answer is chance level.
Neither number is "wrong", but only one of them answers the question we care about.
Note that `groups` is passed to `cross_val_score`, not to the splitter's constructor.

# Correlations in time (and/or space)

![:scale 70%](images/time_series1.png)

???
The second common violation is time. This is the bike-sharing series from the opening slide:
daily rentals in Washington D.C., 2011 and 2012, with strong yearly seasonality and growth from the first year to the second.
It is not always obvious that a dataset has a time component: almost all data is collected over time,
and the process generating it can drift.

# Correlations in time (and/or space)

![:scale 70%](images/time_series2.png)

???
A random test set picks days scattered over the whole period. Each test day has training days right
before and after it, so predicting it is interpolation, and neighboring days are highly correlated.
The estimate you get this way is much better than what you will see in production.

---
class: center
# Correlations in time (and/or space)

![:scale 70%](images/time_series3.png)

???
In deployment, you train on the past and predict the future. The test set should reflect that:
a block at the end of the series, after all training data.
This is extrapolation, and it is harder, which is exactly why we need to measure it.

---
class: fit
![:scale 100%](images/time_series_cv.png)

???
`TimeSeriesSplit` turns this into cross-validation. Each split trains on all data up to some point
and tests on the next block. Training sets grow over the iterations and always precede the test set.
Unlike k-fold, the data is not shuffled and not every sample is tested; the first block is only ever used for training.

---
class: fit
![:scale 100%](images/time_series_walk_forward_cv.png)

???
With `max_train_size`, the training window has fixed length and slides forward: walk-forward validation.
This is useful when old data is less relevant because the process changes over time.
Whether a growing or a sliding window works better is itself something you can validate.

---
# TimeSeriesSplit in Code

.smaller[
```python
from sklearn.model_selection import TimeSeriesSplit
# bike sharing (OpenML 42712), daily totals 2011-2012
# X: rentals of the last 7 days (lag features), y: rentals today, rows sorted by date
reg = KNeighborsRegressor(n_neighbors=5)
for name, cv in [("KFold(shuffle=True)", KFold(5, shuffle=True, random_state=0)),
                 ("TimeSeriesSplit", TimeSeriesSplit(5))]:
    scores = cross_val_score(reg, X, y, cv=cv, scoring="r2")
    print(f"{name:20s} mean R^2 = {scores.mean():.2f}")
```
```
KFold(shuffle=True)  mean R^2 = 0.71
TimeSeriesSplit      mean R^2 = -0.14
```

`TimeSeriesSplit(n_splits=5, max_train_size=None, test_size=None, gap=0)`
]

???
This is the opening case. Shuffled KFold reports an R squared of 0.71; TimeSeriesSplit gives minus 0.14,
worse than predicting the mean of each test block. The shuffled estimate lets the model train on days after the test day.
The honest estimate also reveals a real weakness: kNN cannot extrapolate the growth from 2011 to 2012
to values it has never seen, and early folds have not yet seen a full year of seasons.
The `gap` argument drops samples between training and test, which you need when the forecast horizon
is longer than one step or when features are built from overlapping windows.
Week 11 builds on this for forecasting.

print("ShuffleSplit:\n", cross_val_score(KNeighborsClassifier(), X, y, cv=ss))
print("RepeatedStratifiedKFold:\n", cross_val_score(KNeighborsClassifier(), X, y, cv=rs))

# What Goes Wrong in Practice

.smaller[
- **Tuning on the test set**: trying "just a few" models on the test set and reporting the best
- **Reporting the best CV score** of a large search as the expected performance
- **Random splits of grouped data**: several images per patient, several sessions per user, near-duplicate rows
- **Random splits of time-ordered data**: fraud, demand, sensor data, anything that drifts
- **Preprocessing before splitting**: scaling, feature selection or imputation fitted on all data (Week 3)
- **Unstable conclusions**: one split, no `random_state`, no spread reported
]

???
These are the failures I see most often, in student projects and in published work. Medical imaging is a
well-known example: when images of the same patient end up in both training and test sets, reported accuracy
can be far above what the model achieves on new patients. Each item on this list inflates the estimate,
and none of them produces an error message; the code runs and the number looks good.
Ask the class: which of these would a reviewer be able to detect from the paper alone? Usually none,
which is why you must state your validation scheme explicitly.

---
# Choosing a Splitter

| Data situation | Splitter |
|---|---|
| i.i.d. regression | `KFold(shuffle=True)`, `RepeatedKFold` |
| i.i.d. classification, esp. imbalanced | `StratifiedKFold`, `RepeatedStratifiedKFold` |
| Very large data, quick estimates | `ShuffleSplit`, `StratifiedShuffleSplit` |
| Repeated measurements (patients, users, cities) | `GroupKFold`, `StratifiedGroupKFold`, `LeaveOneGroupOut` |
| Ordered in time, forecasting | `TimeSeriesSplit` (with `gap`, `max_train_size`) |

Rule: the split must mimic how the model will be used.

???
Here is the summary to take home. The question is always: what will the model see after deployment,
and does my validation split reproduce that?
If both groups and time are present, time usually takes priority, and you may need a custom split.
In your homework and project, state and justify the splitter you use, and log it to MLflow with the results.
Next week we look at preprocessing and pipelines, and at data leakage, which is the other main way evaluations go wrong.

# Influence of Number of Neighbors

![:scale 50%](images/knn_boundary_k3.png)

???
With three neighbors, the predictions for these points change.
So the number of neighbors matters a lot, but what is the right value?
This is our first hyper-parameter: a setting that is not learned by `fit`
and has to be chosen some other way. Most of today is about how to choose it honestly.

---
# Computational Properties
.left-column[
## Naive
- fit: no time
- memory: O(n * p)
- predict: O(n * p)
]
.right-column[
## Kd-tree
- fit: O(p * n log n)
- memory: O(n * p)
- predict:
- O(k * log(n))<br />
  FOR FIXED p!
]
.reset-column[
n=n_samples
p=n_features
]

???
A kd-tree or ball tree partitions the space at fit time, which costs about n log n,
and can make queries logarithmic in n. The catch is the "for fixed p": in high dimensions
these structures degrade toward brute force. scikit-learn chooses automatically with `algorithm='auto'`.
For very large datasets, approximate nearest neighbor libraries are the usual answer.

# Overfitting the validation set

![:scale 80%](images/overfitting_validation_set_2.png)

???
The validation curve is the true curve plus noise, because the validation set is a finite sample.
With a small validation set, that noise can be several percentage points.

---
class: center, fit
# Overfitting the validation set

![:scale 80%](images/overfitting_validation_set_3.png)

???
We pick the hyper-parameter with the maximum validation accuracy.
Taking the maximum of noisy values selects a point where the noise happened to be positive,
so the validation score at the optimum overestimates the true accuracy there.

---
class: center, fit
# Overfitting the validation set

![:scale 80%](images/overfitting_validation_set_4.png)

???
An independent test set has independent noise, so its score at the chosen point is unbiased,
and typically lower than the validation score. This is why we report the test score, not the best validation score.
The more configurations you try, the larger this gap tends to be; keep that in mind for Week 8,
when we search over hundreds of configurations.
