# Metrics for Binary Classification
???
We start with the two-class case, because almost everything else is built from it. Multi-class metrics are mostly averages of binary ones, and even regression metrics follow the same logic of "choose the loss that matches the decision".

---
# Review: confusion matrix
.center[
![:scale 55%](images/confusion_matrix.png)
]
.larger[
$$\text{Accuracy} = \frac{\text{TP} + \text{TN}}{\text{TP} + \text{TN} + \text{FP} + \text{FN}}$$
]
???
Accuracy is the diagonal divided by everything. Every metric today is some function of these four numbers, or of how they change as we move a threshold. Make sure everyone agrees on the layout: rows are the true class, columns are the prediction, which is scikit-learn's convention.

class: center, middle
# Positive & Negative are arbitrary
## Though often the minority class is considered positive
???
Which class we call "positive" is a convention, but precision, recall and F1 all change if we swap it. In practice we usually call the rare, interesting class positive: the finding, the fraud, the failure. When you read a paper that reports precision and recall, always check which class was positive.

# Precision, Recall, f-score
.left-column[
`$$ \large\text{Precision} = \frac{\text{TP}}{\text{TP}+\text{FP}}$$`<br />
`$$\large\text{Recall} = \frac{\text{TP}}{\text{TP}+\text{FN}}$$`<br />
`$$\large\text{F} = 2 \frac{\text{precision} \cdot\text{recall}}{\text{precision}+\text{recall}}$$`]
.right-column[
<br />
Positive Predictive Value (PPV)
<br />
<br />
<br />
<br />
Sensitivity, coverage, true positive rate.
<br />
<br />
<br />
<br />
Harmonic mean of precision and recall
]
???
Precision asks "of the alarms, how many were real"; recall asks "of the real cases, how many did we catch". All three depend on which class is positive. F1 weights precision and recall equally, which is a choice; the F-beta score lets you weight recall beta times as much, and that is often a better match to asymmetric costs.

# Averaging strategies

`$$\text{macro }\frac{1}{\left|L\right|} \sum_{l \in L} R(y_l, \hat{y}_l)$$`

`$$\text{weighted } \frac{1}{n} \sum_{l \in L} n_l R(y_l, \hat{y}_l)$$`


.smaller[
```python
print("Weighted average: ", recall_score(y_true, y_pred_1, average="weighted"))
print("Macro average: ", recall_score(y_true, y_pred_1, average="macro"))
```
```
Weighted average: 0.90
Macro average: 0.50
```
]
<br />
???
Each class in turn is treated as positive (one-vs-rest), a binary metric is computed, and the results are averaged. Macro averaging gives every class the same weight; weighted averaging gives every sample the same weight, so large classes dominate. For the always-negative classifier, weighted recall is 0.9, the same as accuracy, while macro recall is 0.5. If you care about the small classes, use macro; "micro" and "samples" matter mainly for multi-label problems, which we skip.

---
class: spacious
# Balanced Accuracy
.smaller[
```python
balanced_accuracy_score(y_t, y_p) == recall_score(y_t, y_p, average='macro')
```
]

$$\text{balanced accuracy} = \frac{1}{2}\left( \frac{TP}{TP + FN} + \frac{TN}{TN + FP}\right )$$

- Always 0.5 for chance predictions
- Equal to accuracy for balanced datasets
- Related single-number alternative: Matthews correlation coefficient (`matthews_corrcoef`)
???
Balanced accuracy is macro-averaged recall: the mean of sensitivity and specificity. Its main advantage is interpretability, since chance level is always 0.5 regardless of imbalance. The Matthews correlation coefficient is another single number that uses all four cells of the confusion matrix and is popular in bioinformatics; it is available as a scorer too.

# Goal setting!
- What do I want? What do I care about?
- Can I assign costs to the confusion matrix?
- What guarantees do we want to give?

???
Before choosing a metric, talk to whoever will use the model. Can you put a cost on each cell of the confusion matrix, for example a false positive costs one extra review and a false negative costs a late diagnosis? Or is there a constraint, such as "recall must be at least 90%", and we maximize precision subject to it? Writing this down early saves a lot of wasted model selection.

# Average Precision
.center[
![:scale 100%](images/avg_precision.png)
]
???
Average precision sums the precision at each threshold weighted by the increase in recall, which is a step-function approximation of the area under the precision-recall curve. It takes all thresholds into account and is sensitive to how well the top of the ranking is ordered. That makes it a good default for comparing models on imbalanced data. Its chance level equals the positive rate, here about 0.02, so it is less easy to interpret than ROC AUC.

---
class: fit
# Area Under ROC Curve (aka AUC)
.center[
![:scale 55%](images/roc_curve_svc_auc.png)
]
- Always .5 for random/constant prediction
- = probability that a random positive is ranked above a random negative

???
ROC AUC is 0.5 for random or constant scores, which makes it easy to interpret. It also has a clean probabilistic meaning: the chance that a randomly chosen positive gets a higher score than a randomly chosen negative. In papers "AUC" almost always means ROC AUC. Like average precision it is a ranking metric, so it is independent of the threshold.

class: fit
# Summary of metrics for binary classification

Threshold-based:
- (balanced) accuracy
- precision, recall, F1 (or F-beta)
- expected cost from a cost matrix

Ranking:
- average precision
- ROC AUC

Probabilistic (Part 2):
- log loss, Brier score

???
Threshold-based metrics judge the decisions a model makes now; ranking metrics judge whether a good threshold exists; probabilistic metrics judge whether the scores can be read as probabilities. For imbalanced binary problems, a reasonable default for model selection is average precision or ROC AUC, followed by explicit threshold selection with a thresholded metric that matches the task. Never optimize precision alone or recall alone: a grid search on recall happily returns a model that predicts everything as positive.

class: center, middle
# Decision thresholds
???
We have seen that the threshold is where ranking turns into decisions. Hand-picking 0.3 on the test set, as I did earlier, is not a valid procedure: it uses test data to make a modelling decision. Scikit-learn now has meta-estimators that make the threshold part of the model and tune it with cross-validation.

---
# The threshold is part of the model

.smaller[
```python
from sklearn.model_selection import FixedThresholdClassifier, TunedThresholdClassifierCV

# set it by hand (e.g. a threshold agreed with domain experts)
rf_03 = FixedThresholdClassifier(RandomForestClassifier(random_state=0), threshold=0.3)
rf_03.fit(X_train, y_train)

# or tune it with cross-validation on the training data
tuned_f1 = TunedThresholdClassifierCV(RandomForestClassifier(random_state=0),
                                      scoring="f1", cv=5)
tuned_f1.fit(X_train, y_train)
print(f"{tuned_f1.best_threshold_:.3f}")
print(f1_score(y_test, rf.predict(X_test)), f1_score(y_test, tuned_f1.predict(X_test)))
```
```
0.414
0.667 0.704
```
]

- Both are ordinary estimators: they work in pipelines, `cross_validate`, `GridSearchCV`
- Available since scikit-learn 1.5

???
`FixedThresholdClassifier` wraps any classifier and applies a given cut-off in `predict`. `TunedThresholdClassifierCV` fits the model in each CV fold, scans the thresholds on the validation fold, and picks the one that maximizes the scorer; then it refits the model on all training data. Here tuning for F1 moves the threshold to about 0.41 and improves test F1 from 0.667 to 0.704. Because the result is a normal estimator, the whole procedure can be cross-validated or put inside a grid search.

---
class: fit2
# Cost-sensitive threshold

.smaller[
```python
COST_FP, COST_FN = 1, 20      # missed finding = 20 extra reviews

def neg_cost(y_true, y_pred):
    tn, fp, fn, tp = confusion_matrix(y_true, y_pred, labels=[False, True]).ravel()
    return -(COST_FP * fp + COST_FN * fn)

tuned_cost = TunedThresholdClassifierCV(RandomForestClassifier(random_state=0),
                                        scoring=make_scorer(neg_cost), cv=5,
                                        store_cv_results=True).fit(X_train, y_train)
```
```
cost-optimal threshold: 0.101
test cost  default 0.5: 604   tuned for F1: 526   tuned for cost: 285
```
]
.center[![:scale 45%](images/tuned_threshold_cost.png)]

???
If the costs of the four cells are known, optimize the cost directly. `make_scorer` turns a metric `(y_true, y_pred)` into a scorer `(estimator, X, y)`, which is what `TunedThresholdClassifierCV`, `cross_validate` and `GridSearchCV` expect. The scorer must be "greater is better", so it returns the negative cost. With a 20:1 cost ratio the best threshold drops to about 0.1 and the test cost falls from 604 to 285, less than half. Note that tuning for F1 is better than the default but still far from the cost optimum: F1 encodes an implicit trade-off that is not your trade-off. For a perfectly calibrated model the optimal threshold would be `COST_FP / (COST_FP + COST_FN)`, about 0.048; the gap is one motivation for calibration in Part 2.

---
class: spacious, fit
# Thresholds: what goes wrong in practice

- **Tuning on the test set**: the reported cost is optimistic. Tune inside CV (or on a validation split), report on the test set
- **Prevalence shift**: a threshold tuned at 2% positives is wrong at 5%; precision-based thresholds are most affected
- **Uncalibrated scores**: "0.3" means nothing by itself; the optimal cut-off depends on the model
- **Multi-class**: no single threshold; use per-class costs on calibrated probabilities (decision theory), or reduce to one-vs-rest decisions

???
These are the mistakes I see most often in project reports. The prevalence point matters for deployment: if the screening population changes, the precision of a fixed threshold changes even though the ROC curve does not. We will come back to monitoring such shifts in Week 12. For multi-class problems there is no `TunedThresholdClassifierCV`; the principled route is to calibrate the probabilities and choose the class with the lowest expected cost.

# Summary of metrics for multiclass classification

Threshold-based:
- accuracy
- precision, recall, f1 (macro average, weighted)

Ranking:
- OVR ROC AUC
- OVO ROC AUC

Probabilistic:
- log loss (cross-entropy)

???
Unlike the binary case, macro-averaged recall or precision alone is a reasonable model-selection criterion, because averaging over classes prevents the degenerate "predict everything as one class" solution. ROC AUC generalizes by averaging one-vs-rest or one-vs-one AUCs (scorer strings `roc_auc_ovr`, `roc_auc_ovo`; the formulas are in the backup). Multi-class ranking metrics are useful for comparing models but do not tell you how to make decisions, since you would need several thresholds. In practice I use macro F1 or macro recall for decisions and log loss when probabilities matter.

---
# Picking metrics

- Accuracy rarely what you want
- Problems are rarely balanced
- Find the right criterion for the task
- OR pick a substitute, but at least think about it
- Emphasis on recall or precision?
- Which classes are the important ones?

???
Summary of Part 1 so far: decide on the metric from the application, not from habit. Ask whether there is a cost matrix or a constraint, which class is positive, whether all classes or all samples should count equally, and whether you will use the default threshold. Write the metric into your project proposal before you start modelling; it keeps the evaluation honest.

# Part 2: Calibration, Imbalanced Data

???
In Part 1 we evaluated models. Now we change the models: first so that their probabilities can be trusted, then so that they cope better with rare classes. Both topics connect back to thresholds: a calibrated model makes threshold choice principled, and many imbalance "fixes" are threshold changes in disguise.

---
class:spacious
# Calibration
.center[
[Niculescu-Mizil & Caruana, Predicting good probabilities with supervised learning, ICML 2005](https://www.cs.cornell.edu/~alexn/papers/calibration.icml05.crc.rev3.pdf)
]
- Probabilities can be much more informative than labels:

- “The model predicted you don’t have cancer” vs “The model predicted you’re 40% likely to have cancer”

???
A classifier that outputs "no cancer" and one that outputs "40% chance" may make the same decision at a 0.5 threshold, but the second gives the radiologist much more to work with. Probabilities also let us plug in costs, combine models, and explain risk to patients. Calibration asks whether a predicted 40% really means that 40% of such cases are positive. The Niculescu-Mizil and Caruana paper is the classic empirical study of which models are calibrated out of the box.

# Comparing Models

.center[![:scale 90%](images/calib_curve_models.png)]
???
Three typical patterns. Logistic regression is close to the diagonal. An unpruned decision tree predicts only 0 or 1 because its leaves are pure, so it is maximally overconfident. The random forest is under-confident at the extremes: averaging many trees pulls predictions towards the middle, giving the characteristic S-shape. Ask the class which pattern a Naive Bayes model would show; it is usually overconfident because of the independence assumption.

class: fit2
# Brier Score (for binary classification)

- “mean squared error of probability estimate”
`$$ BS = \frac{1}{n}\sum_{i=1}^{n} (\widehat{p}(y_i = 1 \mid x_i) - y_i)^{2}$$`

.center[![:scale 60%](images/models_bscore.png)]

.smaller[
| | Brier | log loss | ROC AUC |
|---|---|---|---|
| LogisticRegression | 0.156 | 0.467 | 0.841 |
| DecisionTree | 0.125 | 1.733 | 0.864 |
| RandomForest | 0.071 | 0.247 | 0.970 |
]
???
The Brier score is the mean squared error between the predicted probability and the 0/1 label; lower is better. Log loss is the other standard proper scoring rule and punishes confident mistakes much harder: the decision tree has a middling Brier score but a very bad log loss because of its 0/1 predictions. Both scores mix calibration with discrimination, which is why the forest wins even though it is not the best calibrated: it ranks much better. A constant prediction at the base rate is perfectly calibrated and gets a Brier score of 0.231 with ROC AUC 0.5 here.

---
class: fit
# Fixing it: Calibrating a classifier
- Build another model, mapping classifier probabilities to better probabilities!
- 1d model! (or more for multi-class)

`$$ f_{calib}(s(x)) \approx p(y = 1 \mid x)$$`

- s(x) is the score given by the model
- Can also work with models that don’t even provide probabilities!
- Need a model for $f_{calib}$, and need to decide what data to train it on.
  - Train on training set → overfit
  - Train using a hold-out set or cross-validation → unbiased, costs data or time

???
Calibration is a small one-dimensional model on top of the classifier's score, very much like stacking. The score can be `decision_function` output, so even an SVM gets probabilities. The key question is which data to fit the calibrator on: the training data are useless, because the model is overconfident there. So we need held-out predictions, from a validation split or from cross-validation.

---
# Platt Scaling

- Use a logistic sigmoid for $f_{calib}$
- Basically learning a 1d logistic regression
- (+ some tricks)
- Works well for SVMs

`$$f_{platt} = \frac{1}{1 + \exp(-w s(x) - b)}$$`


???
Platt scaling fits a logistic regression with a single input, the model's score, so it learns only a slope and an offset. That makes it data-efficient and robust with small calibration sets, but it can only correct sigmoid-shaped distortions, which is typical for SVMs and max-margin models. For multi-class problems scikit-learn also offers temperature scaling (`method="temperature"`), a single parameter that rescales all logits before the softmax.

---
# Isotonic Regression

- Very flexible way to specify $f_{calib}$
- Learns arbitrary monotonically increasing step-functions in 1d.
- Groups data into constant parts, steps in between.
- Optimum monotone function on training data (wrt mse).
.center[![:scale 40%](images/isotonic_regression.png)]

???
Isotonic regression fits the best non-decreasing step function to the labels, in the squared-error sense. It can correct any monotone distortion, including the S-shape of random forests, but it needs more data than Platt scaling and can overfit with a few hundred calibration samples. Because it is monotone, it preserves the ranking up to ties, so ROC AUC changes very little.

---

```]

.center[![:scale 80%](images/types_calib.png)]

???
To calibrate an already fitted model, wrap it in `FrozenEstimator`; `fit` then leaves the forest untouched and only fits the calibrator on the data you pass, here the validation set. This replaces the old `cv="prefit"` option, which has been removed. Both methods move the curve onto the diagonal, and isotonic gives the better Brier score here. The cost is that the forest was trained on only three quarters of the training data.

# Cross-validated Calibration

```python

                                       method='isotonic', cv=5)

## Recap on imbalanced data

???
Now the second half of Part 2. We have already seen how to evaluate imbalanced problems; now we look at changing the model or the training data.

---
class: spacious

# Two sources of imbalance

- Asymmetric cost
- Asymmetric data

???
A classification task can be imbalanced in two ways. Costs can be asymmetric even when classes are equally frequent: a missed finding is worse than a false alarm. And data can be asymmetric: one class is much rarer. The two are often confused, and the remedies differ: costs are best handled at the decision (threshold) level, rarity at the estimation level. We already have the threshold remedy from Part 1: `TunedThresholdClassifierCV` with a cost scorer, ideally on calibrated probabilities. So the order I recommend is: calibrate, tune the threshold, and only then consider changing the model.

---

                        X_train, y_train, cv=10,

]

???
This is the one resampling example I show in the main flow; oversampling, SMOTE and resampling ensembles are in the backup. Random undersampling drops majority samples until the classes are balanced, here keeping 390 of 8,387 training samples. The imbalanced-learn pipeline calls the sampler's `fit_resample` only during `fit`, so each validation fold is scored on its original distribution. For logistic regression, ROC AUC is essentially unchanged and average precision drops. For the forest, ROC AUC goes up from 0.936 to 0.949 while average precision drops from 0.732 to 0.591. The two metrics disagree because they emphasize different parts of the curve. Given that we used 5% of the data, holding ROC AUC is remarkable, and for very large datasets undersampling is a practical way to afford a more expensive model. Treat resampling as an experiment to compare against the tuned-threshold baseline, not as a default step.

---
class: spacious

# Class-weights

- Instead of repeating samples, re-weight the loss function.
- Works for most models!
- Same effect as over-sampling (though not random), but not as expensive (dataset size the same).

???
Instead of repeating samples we can weight their loss. A weight of 40 on each positive has the same effect on the objective as repeating it 40 times, without enlarging the dataset and without randomness. Most scikit-learn classifiers accept `class_weight`, and most estimators accept `sample_weight` in `fit`. In linear models and SVMs the weight multiplies each sample's loss; in trees it enters the impurity and the leaf vote; `class_weight="balanced"` gives class k the weight n / (number of classes × n_k). The formulas are in the backup.

---

---
# What goes wrong in practice

.smaller[
```python
# resampling BEFORE cross-validation
X_res, y_res = SMOTE().fit_resample(X_train, y_train)
cross_validate(RandomForestClassifier(), X_res, y_res, cv=5, scoring="average_precision")
```
```
reported average precision: 0.989      # honest (SMOTE inside the pipeline): 0.688
```
]

- Resampling before splitting leaks: synthetic points built from validation positives, balanced validation folds
- Resampling and class weights **distort probabilities**: re-calibrate, or tune the threshold afterwards
- For well-specified probabilistic models, "fixing" imbalance can hurt: van den Goorbergh et al., *JAMIA* 2022; Elor & Averbuch-Elor, *To SMOTE, or not to SMOTE?* 2022

???
SMOTE creates synthetic positives by interpolating between a positive and one of its nearest positive neighbours; the details are in the backup. The first mistake is common in published work: resampling the whole dataset and then cross-validating. The validation folds contain synthetic points interpolated from their own neighbors and have a balanced class distribution, so average precision jumps from 0.69 to 0.99. Second, any resampling or weighting changes the base rate the model sees, so its probabilities are no longer calibrated for the real population. Third, recent studies find that with strong models, such as gradient boosting, a calibrated model plus a tuned threshold often matches or beats resampling. My default is: good probabilistic model, calibrate, tune the threshold for the cost; try resampling as an experiment, not as a reflex.

# Summary

- Pick the metric from the application; report a ranking metric and a thresholded one
- The threshold is a decision: tune it with CV (`TunedThresholdClassifierCV`), with costs if you have them
- Check calibration (reliability diagram, Brier score); calibrate with `CalibratedClassifierCV`
- Imbalance: calibrate and tune the threshold first; class weights are cheap; resampling is an experiment
- Resample inside the pipeline, never before the split

???
If you remember one workflow from today: choose the metric with the stakeholder, compare models with ranking metrics in cross-validation, calibrate the chosen model if probabilities matter, then tune the threshold for the actual costs, and report everything on an untouched test set. Next week, Week 8, we turn model comparison into a systematic process: hyperparameter tuning, nested cross-validation, statistical comparison of models, and MLflow tracking of all of it.

# Further reading on evaluation curves

- [The Relationship Between Precision-Recall and ROC Curves](https://www.biostat.wisc.edu/~page/rocpr.pdf) (Davis & Goadrich, ICML 2006)
- [Precision-Recall-Gain Curves: PR Analysis Done Right](https://papers.nips.cc/paper/5867-precision-recall-gain-curves-pr-analysis-done-right.pdf) (Flach & Kull, NeurIPS 2015)
- [Scikit-learn user guide: tuning the decision threshold](https://scikit-learn.org/stable/modules/classification_threshold.html)

???
Davis and Goadrich show that a curve dominates in ROC space if and only if it dominates in PR space, and explain why PR interpolation is non-linear. Flach and Kull propose a rescaled PR curve with a proper baseline. The scikit-learn guide is the practical reference for the threshold tools we see next; it is a good starting point for the project reports.

# Multi-class ROC AUC
- Hand &amp; Till, 2001, one vs one
`$$ \frac{1}{c(c-1)}\sum_{j=1}^{c}\sum_{k \neq j}^{c} AUC(j,k)$$`
- Provost &amp; Domingos, 2000, one vs rest
`$$ \frac{1}{c}\sum_{j=1}^{c}p(j) AUC(j,\text{rest}_j)$$`

.smaller[
```python
roc_auc_score(y_test, lr.predict_proba(X_test), multi_class="ovo", average="macro")
# scorer names: roc_auc_ovo, roc_auc_ovo_weighted, roc_auc_ovr, roc_auc_ovr_weighted
```
]
???
There are two families. Hand and Till average the AUC over all pairs of classes (one-vs-one); Provost and Domingos average one-vs-rest AUCs weighted by class prevalence. Each can be weighted or unweighted, so four variants exist, and all four are available in `roc_auc_score` and as scorer strings. Unweighted versions give each class the same importance, which is usually what you want with imbalanced classes.

# The Scorer interface (vs the metrics interface)
```python
# metric function interface: (y_true, y_pred or y_score)
y_probs = rf.predict_proba(X_test)
ap_rf = average_precision_score(y_test, y_probs[:, 1])
y_pred = rf.predict(X_test)
ba_rf = balanced_accuracy_score(y_test, y_pred)
# scorer interface: (estimator, X, y)
from sklearn.metrics import get_scorer, make_scorer
ap_scorer = get_scorer('average_precision')
ap_rf = ap_scorer(rf, X_test, y_test)
ba_scorer = get_scorer('balanced_accuracy')
ba_rf = ba_scorer(rf, X_test, y_test)
# turn a metric into a scorer
f2_scorer = make_scorer(fbeta_score, beta=2)
```
???
There are two interfaces. Metrics take true labels and predictions or scores; scorers take a fitted estimator and data, and decide themselves whether to call `predict`, `predict_proba` or `decision_function`. Cross-validation, grid search and `TunedThresholdClassifierCV` all use scorers. `make_scorer` converts any metric into a scorer; pass `response_method="predict_proba"` for metrics that need scores.

# Building the model
- Using the training set is bad
- Either use hold-out set or cross-validation
- Cross-validation can be used to make unbiased probability predictions, use that as training set.

???
Two options. With a hold-out set, we fit the classifier on one part and the calibrator on the other, losing data for the classifier. With cross-validation, every sample gets an out-of-fold prediction that can be used to fit the calibrator, which uses all the data at the price of fitting the model several times.

.smaller[
Log loss: uncalibrated RF 1.533 · sigmoid (one-vs-rest) 0.539 · temperature scaling 0.652

# Scikit-learn vs resampling

![:scale 55%](images/pipeline.png)

???
A scikit-learn pipeline passes `X` through transformers, but `y` and the number of samples stay fixed, so a transformer cannot drop or add samples. Resampling needs to change both `X` and `y`, and it must happen only during `fit`, never on the data we predict on.

- The transform method only transforms X
- Pipelines work by chaining transforms
- To resample the data, we need to also change y

# Imbalanced-learn

https://imbalanced-learn.org

```
uv add imbalanced-learn     # already in the course environment
```

Extends `sklearn` API

???
`imbalanced-learn` is a scikit-learn-contrib package that adds samplers, a pipeline that understands them, and resampling ensembles. It is already installed in our uv environment, so you only need the import. It follows the scikit-learn API closely, so everything we know about cross-validation and grid search carries over.

---
### Sampler

To resample a data set, each sampler implements:
```python
  data_resampled, targets_resampled = obj.fit_resample(data, targets)
```
--
<br />
<br />
In Pipelines:
Sampling only done in `fit`!

???
Samplers have one method, `fit_resample`, which returns new `X` and `y`. The imbalanced-learn `Pipeline` calls it only while fitting, so the model is trained on resampled data but predictions and scores are computed on the original, untouched validation or test data. Not every sampler supports multi-class problems, so check the documentation.

---
# Random Undersampling

```python
from imblearn.under_sampling import RandomUnderSampler
rus = RandomUnderSampler(replacement=False)
X_train_subsample, y_train_subsample = rus.fit_resample(
    X_train, y_train)
print(X_train.shape)
print(X_train_subsample.shape)
print(np.bincount(y_train_subsample))
```
```
(8387, 6)
(390, 6)
[195 195]
```


???
Random undersampling drops majority samples until the classes are balanced. From 8,387 training samples we keep 390, so we throw away over 95% of the data, but training becomes about twenty times cheaper. The `sampling_strategy` parameter lets you stop at a less extreme ratio.

- Drop data from the majority class randomly
- Often until balanced
- Very fast training (data shrinks to 2x minority)
- Loses data!

---
# Random Oversampling

```python
from imblearn.over_sampling import RandomOverSampler
ros = RandomOverSampler()
X_train_oversample, y_train_oversample = ros.fit_resample(
    X_train, y_train)
print(X_train.shape)
print(X_train_oversample.shape)
print(np.bincount(y_train_oversample))
```
```
(8387, 6)
(16384, 6)
[8192 8192]
```
???
Random oversampling repeats minority samples, drawn with replacement, until the classes are balanced. The training set nearly doubles, and each positive appears about 40 times on average. Training gets slower, and models that can memorize, like deep trees, just memorize the repeated points.

- Repeat samples from the minority class randomly
- Often until balanced
- Much slower (dataset grows to 2x majority)

# Class-weights in linear models

`$$\min_{w \in ℝ^{p}, b \in \mathbb{R}} C \sum_{i=1}^n\log(\exp(-y_i(w^T \textbf{x}_i + b )) + 1) + ||w||_2^2$$`

`$$\min_{w \in ℝ^{p}, b \in \mathbb{R}} C \sum_{i=1}^n c_{y_i}  \log(\exp(-y_i(w^T \textbf{x}_i + b )) + 1) + ||w||_2^2$$`

Similar for linear and non-linear SVM

???
For logistic regression, each sample's loss is multiplied by the weight of its class, which is equivalent to using a different C per class. With `class_weight="balanced"` the weight of class k is n divided by (number of classes times n_k), so each class contributes equally to the loss. The same works for the hinge loss in SVMs.

---
class: fit
# Class weights in trees

Gini Index:

`$$H_\text{gini}(X_m) = \sum_{k\in\mathcal{Y}} p_{mk} (1 - p_{mk})$$`

`$$H_\text{gini}(X_m) = \sum_{k\in\mathcal{Y}} c_k p_{mk} (1 - p_{mk})$$`

Prediction:

Weighted vote

???
In trees the class weights enter the impurity computation, so splits that isolate minority samples become more attractive, and leaf predictions become weighted votes. Again this is equivalent to replicating each sample c_k times. Gradient boosting libraries such as LightGBM and XGBoost offer the same through `scale_pos_weight` or sample weights.

class: spacious

# Ensemble Resampling

- Random resampling separate for each instance in an ensemble!
- Chen, Liaw, Breiman: “Using random forest to learn imbalanced data.” (2004)
- Liu, Wu, Zhou: “Exploratory Undersampling for Class-Imbalance Learning” (2009)
- Not in scikit-learn; available in imbalanced-learn

???
Undersampling throws away data, but in an ensemble we can undersample differently for each member. Each tree sees all positives and a different random subset of negatives, so across the ensemble most of the negatives are used. This is the idea behind balanced random forests and EasyEnsemble; the implementations live in imbalanced-learn.

---
# Easy Ensemble with imblearn

.smaller[
```python
from sklearn.tree import DecisionTreeClassifier
from imblearn.ensemble import BalancedBaggingClassifier, BalancedRandomForestClassifier

tree = DecisionTreeClassifier(max_features='sqrt')
resampled_rf = BalancedBaggingClassifier(estimator=tree, n_estimators=100,
                                         random_state=0)
scores = cross_validate(resampled_rf,
                        X_train, y_train, cv=10,
                        scoring=('roc_auc', 'average_precision'))
scores['test_roc_auc'].mean(), scores['test_average_precision'].mean()
# baseline was 0.936, 0.732
```
0.954, 0.667
```python
BalancedRandomForestClassifier(random_state=0)   # 0.952, 0.658
```
]

???
Bagging with a balanced undersample for each of 100 trees, each tree considering the square root of the number of features at each split, is essentially a balanced random forest; `BalancedRandomForestClassifier` gives nearly the same result directly. It reaches the best ROC AUC of all methods today, 0.954, at the cost of a single undersampled forest. Average precision is still below the plain forest, so in the high-precision region the original model remains better.

---
class: center, middle

![:scale 100%](images/roc_vs_pr.png)
???
Comparing all forest variants on the test set: balanced bagging is strong in the high-recall region of the ROC curve and better than simple undersampling at high precision. Plain undersampling uses one subsample of the negatives for all trees; balanced bagging uses a different one per tree, so it sees far more of the data. If the screening program needs high recall, balanced bagging is a good, cheap choice.

## Synthetic Sample Generation

???
Instead of repeating minority samples we can create new ones. Many methods exist, and SMOTE is by far the best known, so it is worth understanding what it does and when it fails.

---
# Synthetic Minority Oversampling Technique (SMOTE)

- Adds synthetic interpolated data to smaller class
- For each sample in minority class:</br>
  – Pick random neighbor from k neighbors (of the same class).</br>
  – Pick point on line connecting the two uniformly.</br>
  – Repeat.</br>


???
SMOTE generates new minority samples by interpolating between a minority sample and one of its k nearest minority-class neighbors. It relies on distances, so scale features first, and it becomes slow and less meaningful in high dimensions. For categorical features use variants such as SMOTENC. It is an oversampling method, so datasets grow, and it can be combined with undersampling.

- Leads to very large datasets (oversampling)
- Can be combined with undersampling strategies

search.fit(X_train, y_train)
results = pd.DataFrame(search.cv_results_)
results.plot("param_smote__k_neighbors", ["mean_test_score", "mean_train_score"])
```

???
The number of neighbors is a hyperparameter of the pipeline, so we can tune it with `GridSearchCV` using the `smote__` prefix. The best value here is 15 with average precision 0.696, but the shaded band of one standard deviation across folds is much wider than the differences between settings. This is a good example of tuning noise, which we treat properly next week with statistical comparison of models.

---
.center[
![:scale 100%](images/smote_k_neighbors.png)
]

???
With more neighbors, SMOTE interpolates between points that are further apart, so the synthetic samples spread over a larger region. Whether that helps depends on whether the space between positives really belongs to the positive class.

???
All forest variants together on the test set. In ROC space the resampling methods look better than the original; in precision-recall space they mostly do not. With only 65 positives in the test set, many of these differences are within noise.
