# Linear Models for Regression

???
Now to the main topic. Everything today is a linear model: the prediction is a weighted sum of the features. What differs between methods is how the weights are chosen.

---
class:center

# Linear Models for Regression

![:scale 50%](images/linear_regression_1d.png)

$$\hat{y} = w^T \mathbf{x} + b = \sum_{i=1}^p w_i x_i +b$$

???
Predictions in all linear models for regression have this form: an inner product of the features with a weight vector w, plus an intercept b. They are called linear because they are linear in the parameters w. You can replace the features by any non-linear functions of the inputs, such as polynomials or splines, and it is still a linear model; we saw that with `PolynomialFeatures` last week. All the models today share this prediction formula and differ in how they find w and b from the training data.

---
# Ordinary Least Squares

$$\hat{y} = w^T \mathbf{x} + b = \sum_{i=1}^p w_i x_i +b $$

`$$\min_{w \in \mathbb{R}^p, b\in\mathbb{R}} \sum_{i=1}^n (w^T\mathbf{x}_i + b - y_i)^2$$`

Unique solution if $\mathbf{X} = (\mathbf{x}_1, ... \mathbf{x}_n)^T$ has full column rank.

???
Ordinary least squares, going back to Gauss and Legendre, picks w and b to minimize the squared error on the training set. If there are more samples than features and the features are not linearly dependent, there is a unique solution that is cheap to compute. If there are more features than samples, or features are exactly collinear, there are infinitely many perfect solutions, and with strong correlations the solution becomes unstable. Ask the class: with one-hot encoding plus an intercept, do we have full column rank?

---
# Ridge Regression

`$$ \min_{w \in \mathbb{R}^p, b\in\mathbb{R}} \sum_{i=1}^n (w^T\mathbf{x}_i + b - y_i)^2 + \alpha ||w||^2 $$`

Always has a unique solution.

Tuning parameter alpha.

???
Ridge regression adds a penalty on the squared L2 norm of w. Now we want to fit the data and also keep the coefficients small, which makes the model less sensitive to small changes in the input. The two terms pull in opposite directions: alpha equal to zero gives ordinary least squares, a very large alpha gives a constant prediction. The right trade-off depends on the data and is chosen by cross-validation. Note that the intercept b is not penalized.

---
# (regularized) Empirical Risk Minimization

`$$ \min_{f \in F} \underbrace{\sum_{i=1}^n L(f(\mathbf{x}_i), y_i)}_{\text{data fitting}} + \underbrace{\alpha R(f)}_{\text{regularization}} $$`

???
Ridge is an instance of a general recipe called regularized empirical risk minimization. Choose a family of functions F, a loss L that measures how well we fit the training data, and a regularizer R that penalizes complex functions. Linear regression, logistic regression, SVMs and neural networks all fit this template with different choices of F, L and R, and much of learning theory is built around it. The intuition: to do well on new data we need to fit the training data reasonably, but we also want a simple model so that training and test performance stay close.

---
# Reminder on model complexity

![:scale 80%](images/overfitting_underfitting_cartoon_full.png)

???
This is the picture from Week 2. Regularization is a knob for model complexity. A large alpha restricts the model and puts us on the left, underfitting. A small alpha lets the model follow the training data and moves us to the right. Tuning alpha is how we look for the sweet spot, just like tuning k in nearest neighbors.

class: fit
# Coefficient of determination R^2

`$$ R^2(y, \hat{y}) = 1 - \frac{\sum_{i=0}^{n - 1} (y_i - \hat{y}_i)^2}{\sum_{i=0}^{n - 1} (y_i - \bar{y})^2} $$`

`$$ \bar{y} =  \frac{1}{n} \sum_{i=0}^{n - 1} y_i$$`

Can be negative for biased estimators - or the test set!

???
The default score for regressors in scikit-learn is R squared. It compares your squared error with the error of always predicting the mean: one is perfect, zero means no better than the mean. On a test set it can be negative, which means the model is worse than predicting the mean. R squared is unitless, which makes it easy to compare across problems, but it hides the scale of the errors. For a house price model the stakeholders will want the error in dollars, so we will also use RMSE or mean absolute error, which the next slides cover. Metric choice for classification comes in Week 7.

---
class: center, middle
# Metrics for regression models
???
Regression metrics are simpler, since there is no threshold, but the choice still matters, mainly through how errors are weighted: squared or absolute, absolute or relative.

---
class:spacious
# Built-in standard metrics
- $\text{R}^2$ : easy to understand scale
- MSE / RMSE : same units as the target (RMSE)
- Mean absolute error, median absolute error: more robust
- MAPE: relative error (`mean_absolute_percentage_error`)
- D² scores: $R^2$-style skill score for other losses (`d2_absolute_error_score`, …)
???
R² is the default score of regressors: 1 is perfect, 0 is the constant mean prediction, negative is worse than that. RMSE is in the units of the target, which makes it easy to communicate. Absolute errors reduce the influence of outliers compared with squared errors. For model selection all of these exist as scorers, with a `neg_` prefix for losses because scorers must be "greater is better".

---
class: spacious, fit3
# Absolute vs Relative: MAPE
`$$ \text{MAPE} = \frac{100}{n} \sum_{i=1}^{n}\left|\frac{y-\hat{y}}{y}\right|$$`

.center[
![:scale 50%](images/mape.png)
]
???
MAPE divides each error by the true value, so the same absolute error counts much more for small targets. On California housing, two test points with an absolute error of about 1.0 (in units of $100k) get a MAPE of 240% and 22% respectively. MAPE is common in forecasting, which we see in Week 11, but it is undefined at zero and explodes near zero, and it penalizes over-prediction more than under-prediction. Use it only when the target is strictly positive and relative error is really what matters.

# Coefficient paths

.center[
![:scale 75%](images/ridge_coefficient_paths.png)
]

???
Let us look inside the models with the regularization path. Plain least squares on this data gives large coefficients of opposite sign on related descriptors, which should make you suspicious of interpreting them; the Backup has the coefficient plots. Each line is one coefficient, and the x-axis is alpha on a log scale. As alpha grows, all coefficients shrink smoothly towards zero; for Ridge they approach zero but never reach it exactly. Some large coefficients collapse quickly once alpha passes a threshold, others stay stable over a wide range. Keep this picture in mind for Lasso, where paths hit zero exactly. A general lesson that the learning curves in the Backup confirm: the less data you have per feature, the more regularization matters.

---
# Lasso Regression

`$$ \min_{w \in \mathbb{R}^p, b\in\mathbb{R}} \sum_{i=1}^n (w^T\mathbf{x}_i + b - y_i)^2 + \alpha ||w||_1 $$`

- Shrinks w towards zero like Ridge

- Sets some w exactly to zero - automatic feature selection!

???
Lasso replaces the squared L2 norm by the L1 norm, the sum of absolute values. It also shrinks coefficients, but in a different way: it sets many of them exactly to zero. A zero coefficient means the feature is not used, so Lasso does feature selection and fitting in one step, which can give smaller and more interpretable models. What we would really like to penalize is the number of non-zero coefficients; the next slides explain why we use L1 instead.

---
class: center
# Understanding L1 and L2 Penalties

![:scale 70%](images/l1l2ball.png)
???
A geometric view in two dimensions. The penalized problem is equivalent to minimizing the data-fitting term subject to a constraint on the norm of w. The L2 constraint region is a disk, the L1 region is a diamond whose corners lie on the axes.

---
class: center
# Understanding L1 and L2 Penalties

![:scale 70%](images/l1l2ball_intersect.png)
???
Now add the contour lines of a quadratic data-fitting term. The solution is where the smallest contour touches the constraint region. For the disk, that point is generally somewhere on the curve with both coordinates non-zero. For the diamond, the contours are much more likely to touch a corner, and at a corner one coefficient is exactly zero. In higher dimensions the diamond has many corners and edges, so many coefficients end up at zero.

---
# Grid-Search for Lasso
```python
param_grid = {'alpha': np.logspace(-5, 0, 10)}
grid = GridSearchCV(Lasso(max_iter=100_000), param_grid, cv=10)
grid.fit(X_train, y_train)

print(grid.best_params_)
print(grid.best_score_)
```
```
{'alpha': 0.0017}
0.163
```

???
Lasso needs its own grid: its alpha is on a different scale from Ridge's, because scikit-learn's Lasso divides the squared error by twice the number of samples, and the default of one is far too large here. Raise `max_iter` so the coordinate descent solver converges. Older code often used `Lasso(normalize=True)`; that option was removed, and the replacement is an explicit `StandardScaler` in a pipeline. The triazine features are all in the range zero to one, so we use them directly. The best cross-validated R squared, 0.16, is better than Ridge's.

# What goes wrong in practice

- **Unstable selection:** of two correlated features, Lasso keeps one, somewhat arbitrarily. Refit on a bootstrap sample and the selected set changes
- **"Zero" is not "irrelevant":** a dropped feature may be as predictive as a kept one
- **Signs flip with alpha:** regularized coefficients are not causal effects
- **Forgotten scaling:** without standardization, the penalty depends on the units of each feature
- **alpha is not comparable** between `Ridge`, `Lasso` and `ElasticNet` (different scaling of the loss)

???
These are the mistakes I see most often in projects and papers. The lab has a short cell that refits Lasso on 50 bootstrap samples and plots how often each feature is selected; many features are selected in some resamples and not in others. If you need to report "important features", report selection stability, and remember that correlated features compete. Scaling is the silent killer: a model on unscaled data runs without error and quietly penalizes some features more than others. We return to feature importance properly in Week 9.

---
# Elastic Net

- Combines benefits of Ridge and Lasso

- two parameters to tune.


`$$\min_{w \in \mathbb{R}^p, b\in\mathbb{R}} \sum_{i=1}^n (w^T\mathbf{x}_i + b - y_i)^2 + \alpha_1 ||w||_1 +  \alpha_2 ||w||^2_2 $$`

???
Elastic Net uses both penalties at once. The L1 part produces exact zeros, the L2 part stabilizes the solution when features are correlated: instead of picking one of a group of correlated features, Elastic Net tends to keep the group together with shared weights. It contains Ridge and Lasso as special cases, at the cost of a second parameter to tune. In practice it is often the best of the three.

---
# Grid-searching ElasticNet

```python
from sklearn.linear_model import ElasticNet
param_grid = {'alpha': np.logspace(-4, -1, 10),
              'l1_ratio': [0.01, .1, .5, .8, .9, .95, .98, 1]}

grid = GridSearchCV(ElasticNet(max_iter=100_000), param_grid, cv=10)
grid.fit(X_train, y_train)

print(grid.best_params_)
print(grid.best_score_)
```
```
{'alpha': 0.0022, 'l1_ratio': 0.5}
0.174
```
```python
(grid.best_estimator_.coef_ != 0).sum()
```
```
16
```
???
scikit-learn parametrizes Elastic Net with an overall strength `alpha` and a mixing parameter `l1_ratio`: 1 is Lasso, 0 a ridge penalty, and because of a 1/(2n) factor on the data term these alphas are not comparable with `Ridge`'s. With two parameters, `GridSearchCV` tries all 80 combinations. For `l1_ratio` I use values close to zero, close to one, and a few in between; the interesting range is often near one. The best model mixes the two penalties equally, uses 16 of 60 features and slightly improves on Lasso. For expensive models, `ElasticNetCV` computes the whole path for each `l1_ratio` much faster than a generic grid search. Remember that the best CV score of 80 candidates is optimistic: on the test set this model scores about 0.10 (heat map of the search in Backup).

# Tracking the regularization path in MLflow

```python
mlflow.set_experiment("week04-linear-models")
with mlflow.start_run(run_name="regularization-path-triazines"):
    for name, make_model in [("ridge", lambda a: Ridge(alpha=a)),
                             ("lasso", lambda a: Lasso(alpha=a, max_iter=100_000))]:
        for step, a in enumerate(np.logspace(-4, 2, 13)):
            scores = cross_val_score(make_model(a), X_train, y_train, cv=cv)
            with mlflow.start_run(run_name=f"{name}-alpha={a:.4g}", nested=True):
                mlflow.log_params({"model": name, "alpha": a})
                mlflow.log_metrics({"cv_r2_mean": scores.mean(), "cv_r2_std": scores.std()})
            mlflow.log_metric(f"{name}_cv_r2", scores.mean(), step=step)
    mlflow.log_figure(fig, "regularization_path.png")
```

???
As in the previous weeks, we log what we try. Each alpha becomes a nested child run with its parameters and cross-validated metrics, and the parent run keeps the whole curve as a stepped metric plus the plot as an artifact. In the MLflow UI you can then sort the child runs by score, or plot `cv_r2_mean` against `alpha` across runs. The full cell, which also logs the number of non-zero coefficients, is in the lab. The habit matters more than the tool: six weeks from now you will not remember which alpha grid you used.

# Part 2: Linear Models for Classification, SVMs

???
We now switch to classification. The same ideas carry over: a linear prediction function, a loss, and a regularizer. What changes is the loss, and that change leads to logistic regression and support vector machines.

---
class: center, middle

# Linear models for <strong>binary</strong> classification

???
We start with two classes, which makes the geometry easy to see, and then extend to several classes.

---
.center[
![:scale 55%](images/linear_boundary_vector.png)
]

$$\hat{y} = \text{sign}(w^T \textbf{x} + b) = \text{sign}\left(\sum\limits_{i}w_ix_i + b\right)$$

???
All linear classifiers predict the same way: compute the same inner product as in regression and look at its sign. Positive means class +1, negative class -1. Geometrically, the decision boundary is a hyperplane, a line in two dimensions, and w is its normal vector, drawn in green here. Sometimes I drop b from the notation; you can always add a constant feature instead, as long as it is left out of the regularization. The algorithms differ in how they find w and b, and the key difference is how they measure mistakes on the training set.

---
class: fit2
# Picking a loss?

$$\hat{y} = \text{sign}(w^T \textbf{x} + b)$$

`$$\min_{w \in ℝ^{p}, b \in \mathbb{R}} \sum_{i=1}^n 1_{y_i \neq \text{sign}(w^T \textbf{x}_i + b)}$$`

.center[
![:scale 40%](images/binary_loss.png)
]

???
The obvious loss is the number of misclassifications, the 0-1 loss in yellow. It is non-convex and discontinuous, and minimizing it is NP-hard in general. So we replace it with a convex upper bound defined on the decision function, the value of w transpose x plus b before taking the sign. The plot is for a point with true label +1. The hinge loss in teal and the log loss in blue are both convex, and both care not only whether a prediction is correct but how confidently it is correct.

---
class: fit
# Logistic Regression


.left-column[
$$\log\left(\frac{p(y=1|x)}{p(y=-1|x)}\right) = w^T\textbf{x} + b$$

$$p(y=1|\textbf{x}) = \frac{1}{1+e^{-w^T\textbf{x} -b }}$$

`$$\min_{w \in ℝ^{p}, b \in \mathbb{R}} \sum_{i=1}^n \log(\exp(-y_i(w^T \textbf{x}_i + b)) + 1)$$`


$$\hat{y} = \text{sign}(w^T\textbf{x} + b)$$
]
.right-column[
![:scale 90%](images/logit.png)]


???
Logistic regression models the log-odds of the positive class as a linear function. Solving for the probability gives the logistic sigmoid on the right, which squashes the decision function into the interval from zero to one. We fit w and b by maximum likelihood, which is the same as minimizing the log loss from the previous slide. Predicting the more probable class is the same as predicting by the sign of the decision function, because the sigmoid crosses one half exactly at zero. Despite its name, logistic regression is a classifier.

---
class: fit2
# Penalized Logistic Regression

`$$\min_{w \in ℝ^{p}, b \in \mathbb{R}}C \sum_{i=1}^n\log(\exp(-y_i(w^T \textbf{x}_i + b )) + 1) + \frac{1}{2}||w||_2^2$$`

`$$\min_{w \in ℝ^{p}, b \in \mathbb{R}}C \sum_{i=1}^n\log(\exp(-y_i (w^T \textbf{x}_i + b)) + 1) + ||w||_1$$`

- C is inverse to alpha: small C = strong regularization
- scikit-learn: `LogisticRegression(C=..., l1_ratio=...)`; `l1_ratio=0` is L2 (default), `1` is L1, in between is elastic net; `C=np.inf` means no penalty

???
As in regression, we add an L2 or L1 penalty, with the same effects: shrinkage, and exact zeros for L1. The convention in scikit-learn is different, though: C multiplies the loss instead of alpha multiplying the penalty, so C is roughly one over alpha. Large C means little regularization. `LogisticRegression` is regularized by default with C equal to one, which surprises people coming from statistics packages. In recent scikit-learn versions the penalty type is chosen with `l1_ratio` and the old `penalty` argument is deprecated; for L1 or elastic net use `solver='saga'`. Both versions are convex, the L2 one is also smooth, and every training point contributes to the solution.

---
# Effect of regularization


.center[
![:scale 90%](images/logreg_regularization.png)
]

- Small C (a lot of regularization) limits the influence of individual points!

???
Coefficient plots for classification look just like the regression ones, so here is a different view of C. The dataset has two mislabeled-looking points: a red point among the blue ones and a blue point among the red ones. With large C, on the right, the boundary tilts to accommodate these outliers: each point can have a large influence. With small C, on the left, the influence of any single point is limited and the boundary follows the bulk of the data. One way to see regularization: it bounds how much any single training point can move the model.

---
class: fit
# Max-Margin and Support Vectors

.center[
![:scale 75%](images/max_margin.png)
]

???
Now to support vector machines. All three lines separate the training data perfectly, so the 0-1 loss cannot tell them apart. The idea of the SVM is to prefer the boundary with the widest margin, the widest band around it that contains no points. Intuitively, a wide margin leaves the most room for noise in new data points. Ask the class which of the three lines they would choose.

---
class: fit2
# (soft margin) linear SVM

.larger[
`$$\min_{w \in ℝ^{p}, b \in \mathbb{R}}C \sum_{i=1}^n\max(0,1-y_i(w^T \textbf{x}_i + b)) + ||w||_2^2$$`

`$$\min_{w \in ℝ^{p}, b \in \mathbb{R}}C \sum_{i=1}^n\max(0,1-y_i(w^T \textbf{x}_i + b))+ ||w||_1$$`
]

$$\text{Within margin} \Leftrightarrow y_i(w^T x_i  + b)< 1 \qquad \text{Smaller } w \Rightarrow \text{larger margin}$$

???
The linear SVM uses the hinge loss: zero if a point is on the correct side with a decision value of at least one, and linear otherwise. The margin has width proportional to one over the norm of w, so the penalty on w is what makes the margin wide; without it, the "one" in the hinge loss would be meaningless because we could just scale w up. Points outside the margin on the correct side have zero loss and do not influence the solution at all. The points on or inside the margin are the support vectors. Both versions are convex but not smooth, which in practice is not a problem.

---

So which one should you use? If you need probability estimates, as in our tumour example, use logistic regression: its probabilities are often reasonably calibrated, and we will check calibration properly in Week 7. If you only need a label, try both and pick by cross-validation; the difference is usually small. If you want a compact model or believe only a few features matter, use the L1 penalty with either.

# Multiclass classification


???
So far two classes. There are two ways to handle more: reduce the problem to several binary problems, which works for any binary classifier, or use a model with a native multiclass formulation, which logistic regression has.

---
class: spacious

# One vs Rest (OvR)

- One binary classifier per class: class $i$ against all other classes
- For 4 classes: 1v{2,3,4}, 2v{1,3,4}, 3v{1,2,4}, 4v{1,2,3}
- Each trained on all the data
- Predict the class with the highest score:

$$\hat{y} = \text{arg}\max_{i \in Y} \textbf{w}^T_i\textbf{x} + b_i$$

???
One-vs-rest is the simplest reduction. For each class we train a binary classifier separating it from all other classes, so we get one coefficient vector and one intercept per class. To predict, we evaluate all of them and pick the class whose classifier gives the highest decision value. It is a heuristic, since the binary classifiers are trained independently and their scores are not calibrated against each other, but it works well in practice.

---
class: spacious, fit
.left-column[
## One vs Rest
- n_classes classifiers
- trained on imbalanced datasets of original size
- Retains some uncertainty?
![:scale 80%](images/ovr_boundaries.png)
]

.right-column[
## One vs One
- n_classes * (n_classes - 1)/2  classifiers
- trained on balanced subsets
- No uncertainty propagated
![:scale 80%](images/ovo_boundaries.png)
]
???
One-vs-one trains a classifier for every pair of classes, using only those two classes, and predicts by majority vote. To summarize: OvR trains fewer classifiers, each on the full data but with an imbalanced split of one class against the rest, and it keeps some notion of confidence. OvO trains more classifiers on smaller, balanced subsets, which can be faster for kernel methods whose cost grows superlinearly with the number of samples, but it discards confidence. Both are general reductions that work with any binary classifier, not only linear ones.

---
class: fit2
# Multinomial Logistic Regression

Probabilistic multi-class model:

`$$p(y=i|x) = \frac{e^{\textbf{w}_i^T\textbf{x} + b_i}}{\sum_{j=1}^k e^{\textbf{w}_j^T\textbf{x} + b_j}}$$`

`$$\min_{w \in ℝ^{pk}, b \in \mathbb{R}^k} -\sum_{i=1}^n \log(p(y=y_i|x_i, w, b))$$`

$$\hat{y} = \text{arg} \max_{i=1,...,k} \textbf{w}^T_i\textbf{x} + b_i$$

- Same prediction rule as OvR !

???
Logistic regression has a natural multiclass version. Each class has its own linear score, and the softmax function turns the scores into probabilities that are positive and sum to one. All coefficient vectors are fitted jointly by maximum likelihood, rather than independently as in OvR. The prediction rule is the same as in OvR, the class with the highest score, but the probabilities now come from one coherent model. You will meet the softmax again in Week 6 as the output layer of a neural network classifier.

---
class: some-space

# In scikit-learn

- `LogisticRegression`: multinomial (softmax) for more than two classes; the `multi_class` option was removed
- `LinearSVC`: one-vs-rest; `SVC`: one-vs-one internally
- Explicit reductions for any estimator: `OneVsRestClassifier`, `OneVsOneClassifier`
- `clf.decision_function` = $w^Tx + b$
- `logreg.predict_proba`
- `SVC(probability=True)`: slow, internal cross-validation, rarely worth it

???
In current scikit-learn, `LogisticRegression` always fits the multinomial model when there are more than two classes; older code that sets `multi_class` will now fail. If you want one-vs-rest explicitly, wrap the estimator in `OneVsRestClassifier`. `LinearSVC` uses one-vs-rest and kernel `SVC` uses one-vs-one. `predict_proba` gives an array of shape samples by classes whose rows sum to one. `SVC(probability=True)` fits an extra calibration model with internal cross-validation: it is slow and the probabilities are often not better than a proper calibration step, which we discuss in Week 7. If you need probabilities, start with logistic regression.

class: center, middle

# Kernel SVMs

???
Linear models can only draw hyperplanes. Kernel SVMs keep the convex optimization problem of the linear SVM but produce non-linear decision boundaries.

---
class: spacious

# Motivation

- Go from linear models to more powerful nonlinear ones.
- Keep convexity (ease of optimization).
- Generalize the concept of feature engineering.

???
The motivation: we want non-linear models, but we want to keep a convex problem with a unique solution, which neural networks, for example, do not have. The way there is to generalize feature engineering. Instead of designing features, such as polynomials, we design a similarity function between data points, the kernel. A polynomial kernel does essentially the same thing as polynomial features; the Backup compares the two explicitly.

---
class: spacious

# Introducing Kernels


$$\hat{y} = \text{sign}\left(\sum_i^{n}\alpha_i (\mathbf{x}_i^T  \mathbf{x})\right) \longrightarrow \hat{y} = \text{sign}\left(\sum_i^{n}\alpha_i (\phi(\mathbf{x}_i)^T  \phi(\mathbf{x}))\right) $$

$$ \phi(\mathbf{x}_i)^T \phi( \mathbf{x}_j) \longrightarrow k(\mathbf{x}_i,  \mathbf{x}_j) $$

k positive definite, symmetric $\Rightarrow$ there exists a $\phi$! (possibly $\infty$-dim)


???
A result from optimization theory, the representer theorem, says the optimal SVM weight vector is a weighted sum of the training points, with non-zero weights (dual coefficients, bounded by C) only for the support vectors; the derivation and a worked example are in Backup. So the prediction needs only inner products between support vectors and the new point, and if we first map the data with a feature function phi, only inner products of mapped points. Both training and prediction only ever need inner products of mapped points. So we can replace the inner product by a function k of two points, the kernel, and never compute phi explicitly. Mercer's theorem says that any symmetric positive definite kernel corresponds to an inner product in some feature space, possibly infinite-dimensional. That is the kernel trick: we design a similarity function instead of a feature map.

---
class:spacious

# Kernels in Practice

- Dual coefficients less interpretable
- Long runtime for "large" datasets (100k samples)
- Real power in infinite-dimensional spaces: rbf!
- Rbf is "universal kernel" - can learn (aka overfit) anything.
- Scale up with kernel approximation: `Nystroem`, `RBFSampler` + a linear model

???
In practice: dual coefficients are weights on training points, which is harder to interpret than weights on features. Training becomes slow beyond some tens of thousands of samples. The real strength is the RBF kernel, which corresponds to an infinite-dimensional feature space and is universal, meaning it can approximate any decision boundary and therefore also overfit any training set, like kNN, trees or neural networks. For larger data, approximate the kernel with an explicit random feature map such as `Nystroem` and fit a linear model on top; on the digits data in the lab this matches the exact kernel SVM. For large tabular datasets today, gradient boosting, next week's topic, is usually the stronger default.

---
class:spacious

# Preprocessing

- Kernels use inner products or distances.
- Scale your data: `StandardScaler` or `MinMaxScaler`, inside the pipeline
- Gamma parameter in RBF directly relates to scaling
of data and n_features - the default `gamma='scale'` is `1/(X.var() * n_features)`

???
Most kernels are built on inner products or distances in the original space, so feature scaling is essential, for the same reason as for kNN in Week 2. The default parameters of `SVC` are designed for standardized data: with standardized features the default `gamma='scale'` is simply one over the number of features. On unscaled data the defaults can give terrible results, and the model will not warn you. Put the scaler in the pipeline so that it is fitted on the training folds only.

---
class: fit
# Parameters for RBF Kernels

- Regularization parameter C is limit on alphas
(for any kernel)
- Gamma is bandwidth: $k_\text{rbf}(\mathbf{x}, \mathbf{x}') = \exp(-\gamma||\mathbf{x} -\mathbf{x}'||^2)$


.center[
![:scale 85%](images/svm_gamma.png)
]

???
The RBF SVM has two parameters, both controlling complexity. C bounds the dual coefficients, that is, the influence of each point. Gamma is the inverse width of the kernel: the plot shows the kernel value as a function of the distance between two points. Small gamma means a wide kernel, so each point influences a large region and the decision function is smooth. Large gamma means a narrow kernel, each point only influences its immediate neighborhood, and the model behaves more like nearest neighbors. Both parameters should be tuned together.

---
.center[
![:scale 85%](images/svm_c_gamma.png)
]

???
A grid of RBF SVMs on a small two-class dataset, with C increasing from top to bottom and gamma increasing from left to right; support vectors are circled. Top left, small C and small gamma, is the simplest model: almost every point is a support vector and the boundary is nearly linear. Increasing C lets individual points matter more, and fewer points remain support vectors. Increasing gamma adds curvature, and at the far right each point gets a small island of its own class, which clearly overfits. Several combinations of C and gamma give similarly good boundaries, because the two parameters trade off against each other.

# Parametrization in scikit-learn

`$$\min_{w, b} \frac{1}{2n}\sum_{i=1}^n (w^T\mathbf{x}_i + b - y_i)^2 + \alpha \eta ||w||_1 +  \frac{\alpha (1 - \eta)}{2} ||w||^2_2 $$`

Where $\eta$ is the relative amount of l1 penalty (`l1_ratio` in the code).
???
scikit-learn parametrizes Elastic Net with an overall strength alpha and a mixing parameter `l1_ratio`. With `l1_ratio=1` you get Lasso, with `l1_ratio=0` a ridge penalty, though for pure L2 the dedicated `Ridge` class is faster and more accurate. Note the factor 1/(2n) on the data term, which is why alpha values here are not comparable with `Ridge`'s alpha. Also do not set alpha to zero in Ridge or Lasso to get least squares: the solvers are not designed for it, use `LinearRegression` instead.

# One vs One (OvO)

- One binary classifier per pair of classes: 1v2, 1v3, 1v4, 2v3, 2v4, 3v4
- n * (n-1) / 2 classifiers, each trained only on the two classes involved

- Again, a heuristic

???
One-vs-one trains a classifier for every pair of classes, using only the data of those two classes. With k classes that is k times k minus one over two classifiers, so it grows quadratically, but each one is trained on a smaller, balanced subset. To predict, each pairwise classifier votes, and the class with the most votes wins, with ties broken by a fixed rule. Like OvR, it has no strong theoretical justification but works well.

# Computational considerations (all linear models)

- Don't use `SVC(kernel='linear')`, use `LinearSVC` (or `LogisticRegression`)
- `LinearSVC(dual='auto')` (default) picks primal or dual from the data shape
- `LogisticRegression`: default `lbfgs` is fine for small and medium data; `saga` for L1 / elastic net and large sparse data
- For `n_features >> n_samples` with L1: `LassoLars` / `lars_path`
- For small n_samples (< 10,000), don't worry
- `SGDClassifier` / `SGDRegressor` for data that does not fit in memory (`partial_fit`)

???
Some practical advice on speed. Kernel `SVC` with a linear kernel solves a harder problem than necessary; `LinearSVC` and `LogisticRegression` use specialized solvers that scale much better. Primal versus dual: the dual has one variable per sample, the primal one per feature, so the dual is attractive when there are many more features than samples; `LinearSVC` now chooses automatically. For large or sparse data, `saga` supports all penalties. `SGDClassifier` fits linear models with stochastic gradient descent and can learn from data in chunks. For the datasets in this course, any of these will run in seconds, so pick by modeling needs first.

# Reformulate Linear Models

.smaller[
- Optimization Theory

$$ w = \sum_{i=1}^n \alpha_i \mathbf{x}_i $$

(alpha are dual coefficients. Non-zero for support vectors only)


$$ \hat{y} = \text{sign}(w^T \mathbf{x})  \Longrightarrow   \hat{y} = \text{sign}\left(\sum_i^{n}\alpha_i (\mathbf{x}_i^T  \mathbf{x})\right) $$

$$ |\alpha_i| \leq C$$

]

???
A result from optimization theory, the representer theorem, says that the optimal w of the linear SVM is a linear combination of the training points. The weights alpha are called dual coefficients, and they are non-zero only for the support vectors. Substituting this into the prediction function, the prediction depends on the data only through inner products between training points and the new point. The dual coefficients are also bounded by C in absolute value, which is the precise version of "C limits the influence of each point". One small caveat: in this dual notation the label signs are folded into the alphas.

The old default, `gamma='auto'`, is one over the number of features, which only makes sense for standardized data. On raw pixel values from 0 to 16 it gives 56% accuracy. The current default, `gamma='scale'`, also divides by the overall variance of the data and gets 98.7%; the last cell shows that this is exactly what it computes. Scaling each feature with `StandardScaler` gives 97.7%. Digits is unusual because all pixels share one scale, so a global variance works well; for typical tabular data with different units, per-feature scaling is the safe choice. The lesson for old code and tutorials: defaults change between versions, so state important parameters explicitly.

# Understanding L1 and L2 Penalties
.wide-left-column[
![:scale 100%](images/l2_l1_l0.png)
]

.narrow-right-column[
.smaller[
`$$ \ell_2(w) = \sqrt{\sum_i w_i ^ 2}$$`
`$$ \ell_1(w) = \sum_i |w_i|$$`
`$$ \ell_0(w) = \sum_i 1_{w_i != 0}$$`
]]
???
The L0 "norm" counts non-zero entries. It is exactly what we want for feature selection, but it is discontinuous and non-convex, and minimizing it is combinatorially hard. The L1 norm is the closest convex relative: not differentiable at zero, but still efficient to optimize. The squared L2 penalty grows quadratically, so it punishes large coefficients heavily and small ones hardly at all, which is why it rarely pushes anything all the way to zero.

---
# Understanding L1 and L2 Penalties

.wide-left-column[
![:scale 100%](images/l1_kink.png)
]
.narrow-right-column[
.padding-top[
.smaller[
`$ f(x) = (2 x - 1)^2 $`

`$ f(x) + L2 = (2 x - 1)^2 + \alpha x^2$`

`$ f(x) + L1= (2 x - 1)^2 + \alpha |x|$`
]]]
???
A one-dimensional example: one coefficient x and a quadratic data-fitting term with its minimum at 0.5, in blue. Adding the L2 penalty, in orange, moves the minimum towards zero but not to zero. Adding the L1 penalty, in green, creates a kink at zero, and for a large enough alpha the minimum sits exactly at the kink. That kink is the mechanism behind exact zeros.

# Examples of Kernels


$$k_\text{linear}(\mathbf{x}, \mathbf{x}') = \mathbf{x}^T\mathbf{x}'$$

$$k_\text{poly}(\mathbf{x}, \mathbf{x}') = (\mathbf{x}^T\mathbf{x}' + c) ^ d$$

$$k_\text{rbf}(\mathbf{x}, \mathbf{x}') = \exp(-\gamma||\mathbf{x} -\mathbf{x}'||^2)$$

$$k_\text{sigmoid}(\mathbf{x}, \mathbf{x}') = \tanh\left(\gamma \mathbf{x}^T\mathbf{x}'  + r\right)$$

`$$k_\cap(\mathbf{x}, \mathbf{x}')= \sum_{i=1}^p \min(x_i, x'_i)$$`

- If $k$ and $k'$ are kernels, so are `$k + k', kk', ck', ...$`

???
Commonly used kernels: the linear kernel gives back the linear SVM. The polynomial kernel raises the shifted inner product to a power d. The RBF or Gaussian kernel is a similarity that decays with the squared distance between points and is by far the most used. The sigmoid kernel is not positive definite for all parameters, so treat it with care. The intersection kernel is used for histograms. Sums, products and positive multiples of kernels are again kernels, and domain-specific kernels exist for strings, graphs and sets, which is one reason kernels are still used in areas like chemistry and biology.

---
# Polynomial Kernel vs Features


$$ k_\text{poly}(\mathbf{x}, \mathbf{x}') = (\mathbf{x}^T\mathbf{x}' + c) ^ d $$

Primal vs Dual Optimization<br /><br />

Explicit polynomials $\rightarrow$ compute on `n_samples * n_features ** d`

Kernel trick $\rightarrow$ compute on kernel matrix of shape `n_samples * n_samples`
<br /><br />
For a single feature:

$$ (x^2, \sqrt{2}x, 1)^T (x'^2, \sqrt{2}x', 1) = x^2x'^2 + 2xx' + 1 = (xx' + 1)^2 $$

???
Explicit polynomial features of degree d create on the order of p to the d features, which quickly explodes: 1000 features and degree 5 is hopeless. With the kernel trick, we only need the n by n matrix of kernel values between training points, whatever the degree. For a single feature you can check that the degree-2 kernel equals the inner product of the features x squared, square root of two times x, and one. So the kernel is the same as explicit polynomial features, up to the scaling factors of the terms.

???
For the kernel SVM there are no primal coefficients at all, only dual coefficients and support vectors. The prediction evaluates the kernel between the new point and each support vector and takes a weighted sum. Here 11 points are support vectors, and many dual coefficients are at plus or minus one, which is the bound C: those points sit inside the margin or are misclassified. Ask the class: what happens to prediction time when the number of support vectors grows with the training set?

# Runtime Considerations

.center[
![:scale 85%](images/svm_runtime.png)
]

???
Here I fit the explicit-feature linear SVM and the polynomial kernel SVM on growing training sets, with the number of features fixed at two; the lower panel uses log-log axes. For small data both are fast. As the number of samples grows, the kernel SVM becomes much slower: training a kernel SVM scales between quadratically and cubically in the number of samples, while a linear model on explicit features scales linearly. When the explicit feature space is small, expand the features; when it is huge or infinite, as for RBF, use the kernel, as long as the number of samples allows.
