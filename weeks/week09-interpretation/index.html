# A model that learned the wrong lesson

.smaller[
- Hospital data, 1990s: predict the risk of death for pneumonia patients, to decide who can be
  treated at home.
- Accurate model; one learned rule: **having asthma lowers the risk**.
- True in the data: asthmatic patients were sent straight to intensive care, and the extra care
  lowered their death rate.
- Deployed as is, the model would have sent the highest-risk patients home.
- (Caruana et al., *Intelligible Models for HealthCare*, KDD 2015)
]

--

.smaller[
Other everyday reasons to look inside a model:
- a lender must tell an applicant the main reasons for a rejection;
- a feature turns out to be a leaked copy of the target;
- a domain expert will not trust a model that cannot show what it uses.
]

???
I start with this case because accuracy did not reveal the problem: the model was right about the data and wrong about the world. Only because the model was interpretable did someone notice the asthma rule. Ask the class: which other features in a medical dataset might encode the treatment rather than the patient's condition? The same pattern shows up in credit scoring, fraud detection and churn prediction, and inspection tools are how we catch it before deployment.

# Model Interpretation (post-hoc)?

- ## Not inference!
- ## Not causality!
- ## Still useful

???
Post-hoc interpretation means we train any model and then probe it. This is not statistical inference: there are no p-values for a random forest's importances, and nothing here tells you what happens if you intervene in the world. It is useful for model debugging, finding leakage, guiding feature engineering, and explaining individual predictions. One caveat up front: if the model is bad, interpreting it tells you nothing about the data.

---
# Types of explanations

## Explain model globally
- How does the output depend on the input?
- Often: some form of marginals

## Explain model locally
- Why did it classify this point this way?
- Explanation could look like a "global" one but be different for each point.
- "What is the minimum change to classify it differently?" (counterfactual explanation)

???
Global explanations summarize behavior over the whole data distribution, for example how the prediction changes as a function of one feature on average. Local explanations are about a single prediction, which is what a loan applicant or a doctor usually needs. Counterfactual explanations answer "what would have to change" and are popular in regulated settings. Keep this distinction in mind: most of the tools today come in both a global and a local flavor.

---
class: spacious
# Explaining the model $\neq$ explaining the data

- Model inspection only tells you about the model
- The model might not accurately reflect the data
- Two equally accurate models can tell different stories

???
This is the most common misconception. If a feature is unimportant to the model, it may still be strongly related to the target, for example because a correlated feature carries the same information. We will see in the case study that five models with the same test score give quite different importance profiles. So say "important to this model", not "important for house prices".

---
# Interpretable models as an alternative

.smaller[
- Instead of explaining a black box, fit a model that is readable by construction:
  - sparse linear / logistic models (Week 4)
  - shallow decision trees, rule lists (Week 5)
  - generalized additive models, e.g. Explainable Boosting Machines (`interpret` package)
- On many tabular problems these are within a small margin of gradient boosting.
- Worth trying first when decisions are high-stakes (Rudin, *Nature Machine Intelligence*, 2019).
]

???
Before reaching for post-hoc tools, check whether an interpretable model is good enough. Generalized additive models fit one shape function per feature, so you can plot the whole model; Explainable Boosting Machines are a modern boosted version of this idea, and they were used on the pneumonia data. The argument by Rudin is that for high-stakes decisions we should prefer models we can read over explanations of models we cannot. We do not install `interpret` in this course, but it is worth knowing about for your projects.

---
# "Features important to the model"?

Naive:
- `coef_` for linear models (abs value or norm for multi-class)
- `feature_importances_` for tree-based models

Use with care!

???
These are the attributes that everyone looks at first because they come for free after fitting. Both have serious problems that we look at on the next slides. Coefficients depend on scaling and correlation; impurity-based importances are biased and computed on training data. Neither gives you a sense of uncertainty.

---
# Linear model coefficients
- Relative importance only meaningful after scaling
- Coefficient = change in prediction per unit change in one feature, **holding the others fixed**
- Correlation among features might make coefficients completely uninterpretable
- L1 regularization will pick one at random from a correlated group
- Any penalty will invalidate usual interpretation of linear coefficients

???
When can you interpret a coefficient? When features are standardized, not strongly correlated, and the model fits well; then the sign and size tell you the partial effect in the model. "Holding the others fixed" is exactly what fails with correlated features: you cannot change the number of rooms without changing the number of bedrooms. With regularization, coefficients are shrunk and, for Lasso, the choice among correlated features is essentially arbitrary. Also remember that classical standard errors do not apply to penalized models.

---
# Impurity-based importances: a pitfall

.smaller[California housing plus two pure-noise columns, random forest (test R² 0.79)]
.center[
![:scale 95%](images/impurity_vs_permutation.png)
]
.smaller[
- Impurity importance is computed on **training** data; it gives `random_num` about as much
  credit as `Population` and ranks `AveOccup` above `Latitude`.
- Permutation importance on **test** data gives both random columns essentially zero.
]

???
Impurity-based importance adds up how much each feature reduced the training loss in all splits. Fully grown trees split on noise, and continuous or high-cardinality features offer more split points, so they collect spurious credit. Permutation importance on the training set still gives the noise column a small positive value, because the forest has memorized the training data; on the test set that disappears. This is the "what goes wrong in practice" message of the first half: never report `feature_importances_` of a deep forest as evidence that a feature matters.

---
# Permutation importance
Idea: measure how much the score depends on one feature, without refitting

`$$I_i^\text{perm} = \text{Acc}(f, X, y) - \mathbb{E}_{x_i}\left[\text{Acc}(f(x_i, X_{-i}), y)\right]$$`

.smaller[
1. Score the fitted model on held-out data.
2. Shuffle column $i$ (breaks its link to $y$ and to the other features), score again.
3. Repeat and average; the drop is the importance of feature $i$.
]

.smaller[
```python
from sklearn.inspection import permutation_importance
result = permutation_importance(model, X_test, y_test, n_repeats=10,
                                scoring="r2", random_state=0, n_jobs=-1)
result.importances_mean, result.importances_std
```
]

???
Walk through the three steps on the board with a small table: shuffle one column, keep the model fixed, rescore. Because it only needs predictions, it works for any model, including pipelines with preprocessing, and it can use whatever scoring metric you care about. Report the spread over repeats, not just the mean; the boxplots on the previous slide came from `importances`. Question for the class: why does shuffling create data points the model never saw? That leads to the next slide.

---
# Permutation importance and correlated features

.left-column[
.smaller[
- Shuffling one of two correlated features creates unrealistic points
  (6 bedrooms in a 2-room house).
- The model can still use the correlated partner, so **both** can look unimportant.
- Remedy: cluster features by rank correlation, keep one per cluster, then compute
  importances.
]
]
.right-column[
![:scale 100%](images/correlated_clusters.png)
]

.tiny[
```python
corr = spearmanr(X).correlation
linkage = hierarchy.ward(squareform(1 - np.abs(corr)))
clusters = hierarchy.fcluster(linkage, t=0.5, criterion="distance")
```
]

???
In California housing, latitude and longitude are strongly (negatively) correlated, and so are median income and average rooms. When features are correlated, importance is shared or hidden, and this is true for permutation importance, SHAP and coefficients alike. Clustering the Spearman correlation matrix and keeping one representative per cluster gives importances that are easier to read. Also mention the conditional permutation idea: permute within groups of similar samples so that the shuffled points stay realistic.

# SHAP: Shapley values for predictions

.smaller[
- From cooperative game theory: the features are "players", the prediction is the "payout".
- Feature $i$ gets its average marginal contribution over all subsets $S$ of the other features:
]
.smaller[
`$$\phi_i = \sum_{S \subseteq F \setminus \{i\}} \frac{|S|!\,(|F|-|S|-1)!}{|F|!}\left[v(S \cup \{i\}) - v(S)\right]$$`
]
.smaller[
- $v(S)$: expected model output when only the features in $S$ are known.
- **Additivity**: $f(x) = \phi_0 + \sum_i \phi_i(x)$, where $\phi_0$ is the average prediction.
- Exact computation is exponential; fast exact algorithms exist for trees (`TreeExplainer`)
  and linear models (`LinearExplainer`); sampling approximations otherwise.
- Library: `shap` (https://github.com/shap/shap)
]

???
The formula looks heavy, but the idea is drop-column importance averaged over every order in which features could be revealed, and computed for one prediction rather than for the score. The Shapley weights are the unique ones that satisfy a small set of fairness axioms, which is the main theoretical selling point. The additivity property is what makes the waterfall plot work: base value plus contributions equals the prediction. Emphasize that v(S) requires a choice of how to "remove" features, which becomes important on the caveat slide.

---

.smaller[
```python

explainer = shap.TreeExplainer(gbrt)          # gradient boosting, California housing
sv = explainer(X_test.sample(1000, random_state=0))   # an Explanation object
shap.plots.beeswarm(sv)
```
]
.center[
![:scale 55%](images/shap_beeswarm.png)
]

???
Each dot is one district, the horizontal position is its SHAP value for that feature, the color is the feature value. High median income pushes the prediction up, and the latitude and longitude rows show the coastal effect in both directions. Features are ordered by mean absolute SHAP value, which is a global summary built from local explanations. Ask: why is there a long tail to the right for MedInc but not to the left?

# SHAP dependence and local explanations

.left-column[
.smaller[
```python
shap.plots.scatter(sv[:, "MedInc"],
                   color=sv[:, "AveOccup"])
```
]
![:scale 100%](images/shap_dependence.png)
]
.right-column[
.smaller[
```python
shap.plots.waterfall(sv[0])
```
]
![:scale 100%](images/shap_waterfall.png)
]

???
The dependence plot shows the SHAP value of one feature against its value; vertical spread at a fixed x indicates interactions, and coloring by a second feature helps find them. It looks like a partial dependence plot but is computed per sample. The waterfall plot is the local explanation: start at the average prediction, add each feature's contribution, arrive at this district's prediction. This is the plot you would show to someone asking "why this price?".

class: fit
# What SHAP values do and do not mean

.smaller[
**They do**
- split one prediction, relative to a baseline, additively among the features;
- describe the **model's** output (in its units: e.g. log-odds for boosted classifiers).

**They do not**
- measure causal effects: "what happens if I raise income" is a different question;
- measure contribution to accuracy: a feature the model overfits can have large SHAP values
  and zero test importance;
- come with uncertainty or significance;
- have a unique answer with correlated features: `TreeExplainer`'s default
  (tree-path-dependent) and the interventional version (`feature_perturbation="interventional"`
  with background data) split credit differently.
- stay fixed when you change the background data or baseline.
]

???
This slide is the one I want you to remember from the SHAP part. SHAP values are an accounting of the model's output, not of the world and not of performance. With correlated features, credit can move from one feature to its partner depending on the variant, so do not read a small SHAP value as "the model does not need this". Compare with permutation importance, which measures what the score loses: the two answer different questions and both are worth computing.

# More model inspection

???
Importances tell us how much a feature matters, not how. Now we look at the shape of the dependence: partial dependence plots and individual conditional expectation curves. These are the tools that let you say "above this income level, predicted value keeps rising roughly linearly".

---
# Partial Dependence Plots
- Marginal dependence of prediction on one (or two) features

`$$f_i^{\text{pdp}}(x_i) = \mathbb{E}_{X_{-i}}\left[f(x_i, x_{-i})\right]$$`

.smaller[
- Process: pick a grid of values for $x_i$; for each grid value, set $x_i$ to it in **every** row,
  predict, and average the predictions.
- Fast recursion method for tree-based models (`method="recursion"`, no data needed)
- For a linear model the PDP is just a straight line with the coefficient as slope.
]

???
Draw the process on the board: copy the dataset once per grid value, overwrite one column, predict, average. That is the "integrate out the other features" in the formula. For gradient boosting and random forests scikit-learn has a fast recursion method that walks the trees instead of predicting on copies. Like permutation importance, the PDP evaluates the model on combinations that may not exist in the data when features are correlated.

---

.left-column[
![:scale 100%](images/pdp_failure.png)
]
--
.right-column[

Here the partial dependence on feature 1 is flat, and one would conclude the feature is irrelevant. The data on the right shows it is highly relevant: its slope is positive for half the data and negative for the other half, depending on the sign of feature 0. Averaging cancels the two effects. A flat PDP does not mean "no effect"; it can mean "effects that cancel".

# Individual Conditional Expectation (ICE)
.smaller[
- Like partial dependence plots, without the final averaging: one curve per sample.
- `kind="individual"` or `kind="both"` (ICE + PDP); `centered=True` anchors curves at the left edge.

```

???
ICE curves show each sample's prediction as we vary one feature, holding its other features fixed. On the failure example they immediately reveal two groups with opposite slopes, which the average hid. Use `subsample` to keep the plot readable. Heterogeneous ICE curves are a signal of interactions, which you can then look for with a two-way PDP or SHAP dependence plots.

# Feature Selection

???
Second half. So far we explained models that use all features. Now we ask which features a model needs, and how to choose them automatically without fooling ourselves. The main methods are univariate tests, model-based selection, recursive elimination and sequential (wrapper) selection.

---
class: spacious

# Why Select Features?

- Avoid overfitting (?)
- Faster prediction and training
- Less storage for model and dataset
- Cheaper data collection
- More interpretable model

???
Improved accuracy is the reason people give most often, and in practice it is the least common benefit: regularized models and ensembles handle irrelevant features reasonably well. The stronger reasons are practical: fewer features means cheaper data collection, simpler pipelines, faster prediction, and a model you can explain. A model with five features instead of five hundred is much easier to validate and to monitor in production, which we discuss in Week 12. Only if you expect that a small subset of features carries the signal should you expect a performance gain.

---
class: spacious

# Unsupervised Feature Selection

- May discard important information
- Variance-based: 0 variance or mostly constant
- Covariance-based: remove correlated features
- PCA: remove linear subspaces

???
Removing constant features is always safe; `VarianceThreshold` does it. Removing low-variance features is not, because a small variance might just mean a small scale. Removing one of two correlated features can discard exactly the difference between them that predicts the target. PCA is not selection at all, since every component uses all original features; we cover it in Week 10.

---

# Mutual Information

```python
from sklearn.feature_selection import mutual_info_regression
scores = mutual_info_regression(X_train, y_train)
```
.center[
![:scale 90%](images/img_22.png)
]

???
Mutual information measures any kind of dependence, not only linear, using a nearest-neighbor estimator; tell it which features are discrete with `discrete_features`. Compare with the F values: latitude and longitude, which have low F values, get substantial mutual information because their relation to price is nonlinear. It is slower than the F test and still univariate: it cannot see that latitude and longitude together define location. The noise features get values close to zero, but not exactly zero, because the estimator itself is noisy.

class: spacious

# Model-Based Feature Selection

- Get best fit for a particular model
- Ideally: exhaustive search over all possible combinations
- Exhaustive is infeasible (and has multiple testing issues)
- Use heuristics in practice.

???
Multivariate selection usually means: find the subset on which a given model has the best cross-validated score. Trying all subsets is exponential, 2 to the 13 here and hopeless beyond a few dozen features, and searching that many subsets overfits the validation data. So we use heuristics: a single fit with importances, recursive elimination, or greedy forward and backward search.

---

lasso = LassoCV(cv=cv).fit(X_train_scaled, y_train)

# Recursive Feature Elimination

- Uses feature importances / coefficients, similar to `SelectFromModel`
- Iteratively removes features (one by one or in groups)
- Runtime: (n_features - n_features_to_keep) / step model fits

???
RFE fits the model, removes the `step` least important features, refits, and repeats until the requested number is left. It needs an estimator with coefficients or importances, so for kernel SVMs or MLPs you would use permutation importance or sequential selection instead. It costs one fit per step, much more than `SelectFromModel`, but it adapts to changing importances.

rfe.ranking_

RFECV runs the elimination on each training fold and picks the number of features with the best mean validation score; `cv_results_` holds the curve. It keeps seven features: all five noise columns and population are removed. Inside a pipeline, cross-validating the whole thing gives an honest estimate, 0.602, essentially the same as with all features. The curve is flat from about six features on, which is typical: often a range of subset sizes is equally good, and you can pick the smallest within one standard error.

# Wrapper Methods

- Can be applied for ANY model!
- Shrink / grow feature set by greedy search
- Called Forward or Backward selection
- Run CV / train-val split per candidate feature
- Complexity: about n_features * (n_features + 1) / 2 CV runs
- `SequentialFeatureSelector` in scikit-learn

???
Sequential selection does not need importances: at every step it tries adding (or removing) each remaining feature, cross-validates, and keeps the best move. That makes it model-agnostic and also expensive: quadratic in the number of features, times the cost of cross-validation. It is a one-step look-ahead approximation to the exhaustive search. Since scikit-learn 0.24 it is built in, so no extra package is needed.

---
# SequentialFeatureSelector

.smaller[
```python
from sklearn.feature_selection import SequentialFeatureSelector
sfs = SequentialFeatureSelector(LinearRegression(), n_features_to_select=7,
                                direction="backward", cv=cv)
sfs.fit(X_train_scaled, y_train)
feature_names[sfs.get_support()]
```
```
['MedInc' 'HouseAge' 'AveRooms' 'AveBedrms' 'AveOccup' 'Latitude' 'Longitude']
```
```python

                                tol=1e-3, direction="forward", cv=cv)
```
```
['MedInc' 'HouseAge' 'AveRooms' 'AveBedrms' 'Latitude' 'Longitude']
```
]

???
Backward selection to seven features finds the same set as RFECV. Forward selection with `n_features_to_select="auto"` and a tolerance stops when adding a feature improves the CV score by less than `tol`, and here it stops at six. The model used for selection does not have to be the model used for prediction: you could select with a gradient boosting model and predict with a linear one, which is attractive when the final model must be simple to explain. Forward and backward can give different answers; neither is guaranteed optimal.

# What goes wrong: selecting features outside CV

.smaller[
Pure noise: 100 samples, 5000 random features, random labels. True accuracy: 50%.
```python
X_sel = SelectKBest(k=20).fit_transform(X_noise, y_noise)       # uses ALL labels
cross_val_score(LogisticRegression(), X_sel, y_noise, cv=5).mean()
```
```
0.85
```
```python
pipe = make_pipeline(SelectKBest(k=20), LogisticRegression())  # refit per fold
cross_val_score(pipe, X_noise, y_noise, cv=5).mean()
```
```
0.48
```
]
.smaller[
- Classic mistake in wide data (genomics, text features); published results have been
  retracted for it (Ambroise & McLachlan, PNAS 2002).
]

???
This is the most important practical slide of the second half. When you select features on all the data, the validation folds have already influenced which features you kept, so the "validation" score measures how well you found chance correlations. With 5000 noise features, 20 of them will correlate with the labels by chance, and the leaky score is 85% on data that contains no signal. The fix is the same as in Week 3: put the selector in the pipeline. The same applies to RFECV and SFS, whose internal CV does not protect the outer estimate.

# Summary

.smaller[
- Explaining a model is not explaining the data, and not causal inference.
- Prefer **permutation importance on held-out data** to `feature_importances_`.
- Correlated features share or hide importance in every method; cluster them first.
- PDPs show average effects; **ICE** curves (`kind="both"`) reveal heterogeneity.
- **SHAP** gives additive local explanations of the model's output; read the caveats.
- Feature selection: univariate (fast, blind to interactions), `SelectFromModel`, `RFECV`,
  `SequentialFeatureSelector`; always **inside** the CV pipeline.
- Next week: unsupervised learning (PCA, t-SNE/UMAP, clustering, mixture models).
]

???
If students remember three things: use held-out data for importances, read SHAP as an accounting of model output, and keep feature selection inside cross-validation. For the project, I expect an interpretation section: at least permutation importance and one dependence plot for your final model, logged to MLflow. Next week we drop the target entirely and look at unsupervised learning, starting with PCA, which also connects to today's discussion of dimensionality reduction.

# Questions?

???
A common question: do forward and backward selection with the same number of features give the same subset? No; both are greedy one-step approximations to the exhaustive search and can end in different subsets. Another frequent one: should I use SHAP or permutation importance in my project? Both, since they answer different questions: SHAP explains predictions, permutation importance explains what the score depends on.

# Drop-column importance

`$$I_i^\text{drop} = \text{Acc}(f, X, y) - \text{Acc}(f', X_{-i}, y)$$`

.smallest[
```python
def drop_feature_importance(est, X, y):
    base_score = np.mean(cross_val_score(est, X, y))
    scores = []
    for feature in range(X.shape[1]):
        mask = np.ones(X.shape[1], dtype=bool)
        mask[feature] = False
        this_score = np.mean(cross_val_score(est, X[:, mask], y))
        scores.append(base_score - this_score)
    return np.array(scores)
```]
.smallest[
- Doesn't really explain the model (refits for each feature)
- Can't deal with correlated features well
- Very slow
- Can be used for feature selection
]
???
Drop-column importance retrains the model without each feature and measures the loss in cross-validated score. It answers "how much would a model lose without this feature", which is a question about the learning problem rather than about the fitted model. If two features are near copies, dropping either costs nothing, so both look unimportant. We come back to this idea in the feature selection half, where backward selection is essentially repeated drop-column importance.

# LIME
.smaller[
- Fit a sparse linear model to the black box's predictions in a neighbourhood of one point.
- Explains a single prediction locally.
- Paper: "Why Should I Trust You?" Explaining the Predictions of Any Classifier (2016)
- Package: `lime`. Explanations depend on the kernel width and the random sampling, and can
  change between runs; SHAP has largely replaced it in tabular practice.
]

.center[
![:scale 60%](images/lime_paper.png)
]

???
LIME was one of the first model-agnostic local explanation methods and the paper is worth reading for the idea. It samples perturbed points around the instance, weights them by distance, and fits a sparse linear model to the black-box predictions. The weak point is that the neighbourhood definition is arbitrary, and studies found explanations to be unstable across runs. I mention it for historical context and because you will meet it in papers; for tabular models we use SHAP.

# Types of Feature Selection

- Unsupervised vs Supervised
- Univariate vs Multivariate
- Model based or not

???
Unsupervised methods ignore the target, supervised ones use it. Univariate methods look at one feature at a time, multivariate ones consider features jointly. Model-based methods use a particular estimator to judge features. Every method we see today can be placed on these three axes; it is a useful way to organize them on an exam-style question in your paper proposal.

# Iterative Model-Based Selection

- Fit model, find least important feature, remove, iterate.
- Or: Start with single feature, find most important feature, add, iterate.

???
Dropping many features at once is risky, because importances change after other features are removed: once longitude is gone, latitude's importance changes. Iterative methods refit after each change. They come in two flavors, backward elimination from all features and forward addition from none. Neither is guaranteed to find the best subset.
